<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigía ERNC</title>
<meta name="description" content="Un agente lee los reportes mensuales ERNC de la CNE y siete reglas verifican cada número. Proyecto de Francisco Ruiz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<!--
  Plantilla de vigia/escritorio.py. No editar docs/index.html a mano:
  se regenera con `python -m vigia escritorio` a partir de la corrida real.
-->
<style>
:root {
  --barra-tareas: 48px;
  --acento: #0067c0;
  --ok: #0f7b0f; --aviso: #c27c0e; --error: #c42b1c;
  --ventana: #f3f3f3; --contenido: #ffffff; --borde: rgba(0,0,0,.12); --texto: #1b1b1b; --tenue: #5f5f5f;
  --lado: #f3f3f3; --hover: rgba(0,0,0,.05); --seleccion: rgba(0,103,192,.10); --campo: #ffffff;
  --sombra: 0 16px 40px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.10);
  --mono: 'Cascadia Mono', 'Cascadia Code', Consolas, 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --acento: #4cc2ff; --ok: #6ccb5f; --aviso: #fce100; --error: #ff99a4;
  --ventana: #202020; --contenido: #272727; --borde: rgba(255,255,255,.09); --texto: #ffffff; --tenue: #b5b5b5;
  --lado: #202020; --hover: rgba(255,255,255,.06); --seleccion: rgba(76,194,255,.14); --campo: #1c1c1c;
  --sombra: 0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
} }
:root[data-theme="dark"] {
  --acento: #4cc2ff; --ok: #6ccb5f; --aviso: #fce100; --error: #ff99a4;
  --ventana: #202020; --contenido: #272727; --borde: rgba(255,255,255,.09); --texto: #ffffff; --tenue: #b5b5b5;
  --lado: #202020; --hover: rgba(255,255,255,.06); --seleccion: rgba(76,194,255,.14); --campo: #1c1c1c;
  --sombra: 0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font: 14px/1.45 var(--sans); color: var(--texto); background: #0a2a5c;
       -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
h1, h2, h3, p, ul, ol, dl, dd, pre { margin: 0; }
ul { padding: 0; list-style: none; }

/* ── Fondo ─────────────────────────────────────────────────────────── */
.fondo { position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(38% 46% at 64% 58%, rgba(214,236,255,.95) 0%, rgba(120,182,255,.75) 28%, rgba(40,110,230,0) 100%),
    radial-gradient(70% 80% at 30% 100%, rgba(30,100,220,.85) 0%, rgba(20,70,180,0) 70%),
    linear-gradient(160deg, #061c45 0%, #0a3a8c 50%, #1257c4 100%); }

/* ── Barra de tareas ───────────────────────────────────────────────── */
.tareas { position: fixed; inset: auto 0 0 0; height: var(--barra-tareas); z-index: 9000;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 10px;
  background: rgba(32,32,32,.82); backdrop-filter: blur(30px) saturate(1.4); border-top: 1px solid rgba(255,255,255,.08); color: #fff; }
.tareas .apps { display: flex; gap: 4px; grid-column: 2; }
.tareas .apps button { position: relative; width: 44px; height: 40px; border-radius: 5px; display: grid; place-items: center; }
.tareas .apps button:hover, .tareas .apps button[aria-expanded="true"] { background: rgba(255,255,255,.08); }
.tareas .apps button svg { width: 26px; height: 26px; }
.tareas .apps button.abierta::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 6px; height: 3px;
  margin-left: -3px; border-radius: 2px; background: #9a9a9a; }
.tareas .apps button.activa { background: rgba(255,255,255,.06); }
.tareas .apps button.activa::after { width: 16px; margin-left: -8px; background: #4cc2ff; }
.tareas .apps button[data-tip]:hover::before { content: attr(data-tip); position: absolute; bottom: 50px; left: 50%;
  transform: translateX(-50%); white-space: nowrap; background: #2b2b2b; color: #fff; font-size: 12px;
  padding: 5px 9px; border-radius: 5px; border: 1px solid rgba(255,255,255,.1); pointer-events: none; }
.bandeja { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 2px; font-size: 12px; }
.bandeja button { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 5px; }
.bandeja button:hover { background: rgba(255,255,255,.08); }
.bandeja svg { width: 15px; height: 15px; fill: #fff; }
.reloj { text-align: right; line-height: 1.3; }

/* ── Menú Inicio ───────────────────────────────────────────────────── */
.inicio { position: fixed; z-index: 9100; bottom: calc(var(--barra-tareas) + 12px); left: 50%; transform: translateX(-50%);
  width: 600px; max-width: calc(100vw - 24px); border-radius: 8px; color: #fff; display: none;
  background: rgba(36,36,36,.92); backdrop-filter: blur(40px) saturate(1.4); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.inicio.abierto { display: block; animation: subir .18s ease-out; }
@keyframes subir { from { transform: translate(-50%, 16px); opacity: 0; } }
.inicio .cuerpo-ini { padding: 28px 32px 18px; }
.inicio h3 { font-size: 14px; font-weight: 600; margin: 0 0 12px 8px; }
.inicio .rejilla-ini { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 22px; }
.inicio .rejilla-ini button { display: grid; justify-items: center; gap: 8px; padding: 12px 4px; border-radius: 5px; font-size: 12px; }
.inicio .rejilla-ini button:hover { background: rgba(255,255,255,.08); }
.inicio .rejilla-ini svg { width: 32px; height: 32px; }
.inicio .recientes { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.inicio .recientes button { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 5px; text-align: left; }
.inicio .recientes button:hover { background: rgba(255,255,255,.08); }
.inicio .recientes svg { width: 30px; height: 30px; flex: none; }
.inicio .recientes b { display: block; font-weight: 400; font-size: 13px; }
.inicio .recientes span span { font-size: 12px; color: #c5c5c5; }
.inicio .pie-ini { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 32px;
  background: rgba(0,0,0,.2); border-top: 1px solid rgba(255,255,255,.08); border-radius: 0 0 8px 8px; flex-wrap: wrap; }
.inicio .quien { display: flex; gap: 12px; align-items: center; font-size: 13px; }
.inicio .quien span span { display: block; font-size: 12px; color: #c5c5c5; }
.inicial { width: 34px; height: 34px; border-radius: 50%; background: #4cc2ff; color: #002642; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.inicio .enlaces { display: flex; gap: 4px; flex-wrap: wrap; }
.inicio .enlaces a { color: #fff; text-decoration: none; font-size: 12.5px; padding: 6px 10px; border-radius: 5px; }
.inicio .enlaces a:hover { background: rgba(255,255,255,.08); }

/* ── Íconos del escritorio ─────────────────────────────────────────── */
.iconos { position: fixed; top: 8px; left: 8px; display: grid; gap: 2px; z-index: 1; }
.iconos button { width: 84px; padding: 6px 2px; border-radius: 4px; display: grid; justify-items: center; gap: 3px; border: 1px solid transparent;
  color: #fff; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.9); word-break: break-word; }
.iconos button:hover { background: rgba(255,255,255,.12); }
.iconos button:focus-visible, .iconos button.sel { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.35); outline: none; }
.iconos svg { width: 44px; height: 44px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }

/* ── Ventanas ──────────────────────────────────────────────────────── */
.ventana { position: fixed; display: flex; flex-direction: column; min-width: 340px; min-height: 220px;
  background: var(--ventana); color: var(--texto); border-radius: 8px; overflow: hidden; resize: both; box-shadow: var(--sombra); }
.ventana[hidden] { display: none; }
.ventana.max { inset: 0 0 var(--barra-tareas) 0 !important; width: auto !important; height: auto !important; border-radius: 0; resize: none; }
.ventana.abriendo { animation: abrir .16s ease-out; }
@keyframes abrir { from { opacity: 0; transform: scale(.97) translateY(6px); } }
.titulo { flex: none; height: 32px; display: flex; align-items: center; user-select: none; touch-action: none; }
.titulo .izq { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding-left: 12px; height: 100%; }
.titulo .izq svg { width: 16px; height: 16px; flex: none; }
.titulo h2 { font-size: 12px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ventana:not(.enfocada) .titulo h2 { color: var(--tenue); }
.controles { display: flex; height: 100%; }
.controles button { width: 46px; height: 100%; display: grid; place-items: center; }
.controles button:hover { background: var(--hover); }
.controles button.cerrar:hover { background: #c42b1c; color: #fff; }
.controles svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1; fill: none; }
.cuerpo { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
body.arrastrando iframe { pointer-events: none; }
body.arrastrando { user-select: none; }
.boton { padding: 4px 11px; border-radius: 4px; background: var(--contenido); border: 1px solid var(--borde); font-size: 13px; }
.boton:hover { background: var(--hover); }
.segmentado { display: inline-flex; gap: 2px; }
.segmentado button { padding: 5px 12px; border-radius: 4px; font-size: 13px; position: relative; }
.segmentado button:hover { background: var(--hover); }
.segmentado button[aria-pressed="true"] { background: var(--hover); font-weight: 600; }
.segmentado button[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 16px; height: 3px; margin-left: -8px; border-radius: 2px; background: var(--acento); }

/* ── PowerShell ────────────────────────────────────────────────────── */
.ventana[data-app="terminal"] { background: #1f1f1f; color: #fff; }
.ventana[data-app="terminal"] .titulo { background: #1f1f1f; }
.ventana[data-app="terminal"] .controles button:hover { background: rgba(255,255,255,.08); }
.ventana[data-app="terminal"] .controles button.cerrar:hover { background: #c42b1c; }
.pestana, .nav-pestana { display: flex; align-items: center; gap: 8px; align-self: flex-end; height: 28px; padding: 0 12px; margin-left: -4px;
  border-radius: 6px 6px 0 0; font-size: 12px; min-width: 190px; }
.pestana { background: #0c0c0c; color: #fff; }
.pestana svg, .nav-pestana svg { width: 14px !important; height: 14px !important; }
.term { flex: 1; overflow-y: auto; padding: 8px 12px 18px; background: #0c0c0c; color: #cccccc; font: 14px/1.4 var(--mono); cursor: text; }
.term pre { font: inherit; white-space: pre-wrap; word-break: break-word; }
.term .linea-entrada { display: flex; flex-wrap: wrap; }
.term input { flex: 1; min-width: 6ch; background: none; border: 0; outline: none; color: #fff; font: inherit; padding: 0; caret-color: #fff; }
.term .prompt { color: #cccccc; white-space: pre; }
.term .orden { color: #61d6d6; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(97,214,214,.35); text-underline-offset: 3px; }
.term .orden:hover { text-decoration-color: currentColor; }
.term .carpeta { color: #3b78ff; }
.term .t-tenue { color: #8a8a8a; }
.term .t-ok { color: #16c60c; }
.term .t-aviso { color: #f9f1a5; }
.term .t-error { color: #e74856; }
.term .t-titulo { color: #f2f2f2; font-weight: 700; }
.term .t-acento { color: #f9f1a5; }
.term ::selection { background: #f2f2f2; color: #0c0c0c; }

/* ── Explorador de archivos ────────────────────────────────────────── */
.exp-barra { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--borde); background: var(--ventana); }
.exp-barra .flecha { width: 30px; height: 30px; border-radius: 4px; display: grid; place-items: center; }
.exp-barra .flecha:hover:not(:disabled) { background: var(--hover); }
.exp-barra .flecha:disabled { opacity: .35; }
.exp-barra .flecha svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.direccion { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; padding: 3px 8px; border-radius: 4px;
  background: var(--contenido); border: 1px solid var(--borde); overflow: hidden; white-space: nowrap; }
.direccion button { padding: 2px 6px; border-radius: 3px; font-size: 13px; }
.direccion button:hover { background: var(--hover); }
.direccion .sep { color: var(--tenue); font-size: 11px; }
.direccion svg { width: 16px; height: 16px; margin-right: 4px; flex: none; }
.exp { flex: 1; display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 0; }
.exp-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--contenido); }
.lado { background: var(--lado); padding: 6px; overflow-y: auto; border-right: 1px solid var(--borde); }
.lado button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; border-radius: 4px; text-align: left; font-size: 13px; position: relative; }
.lado button:hover { background: var(--hover); }
.lado button[aria-current="true"] { background: var(--seleccion); }
.lado button[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 50%; height: 16px; margin-top: -8px; width: 3px; border-radius: 2px; background: var(--acento); }
.lado svg { width: 16px; height: 16px; flex: none; }
.lado .grupo { font-size: 12px; color: var(--tenue); padding: 10px 10px 4px; }
.lista { flex: 1; overflow: auto; }
.lista table { width: 100%; border-collapse: collapse; font-size: 13px; }
.lista th { text-align: left; font-weight: 400; color: var(--tenue); padding: 6px 12px; border-bottom: 1px solid var(--borde); position: sticky; top: 0; background: var(--contenido); white-space: nowrap; }
.lista td { padding: 4px 12px; white-space: nowrap; }
.lista td.nombre { display: flex; align-items: center; gap: 8px; }
.lista td.nombre svg { width: 18px; height: 18px; flex: none; }
.lista td.n, .lista th.n { text-align: right; }
.lista tbody tr:hover { background: var(--hover); }
.lista tbody tr.sel, .lista tbody tr:focus-visible { background: var(--seleccion); outline: none; }
.estado { padding: 4px 12px; font-size: 12px; color: var(--tenue); background: var(--ventana); border-top: 1px solid var(--borde); }

/* ── Editor ────────────────────────────────────────────────────────── */
.editor { flex: 1; overflow: auto; display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--contenido); font: 13.5px/1.55 var(--mono); }
.editor pre { font: inherit; }
.editor .nums { text-align: right; color: var(--tenue); padding: 10px 12px 10px 16px; user-select: none; opacity: .7; }
.editor .codigo { padding: 10px 16px; white-space: pre; tab-size: 4; }
.hl-k { color: #0000ff; } .hl-s { color: #a31515; } .hl-c { color: #008000; } .hl-n { color: #098658; }
.hl-f { color: #795e26; } .hl-h { color: #0451a5; font-weight: 700; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hl-k { color: #569cd6; } :root:not([data-theme="light"]) .hl-s { color: #ce9178; }
  :root:not([data-theme="light"]) .hl-c { color: #6a9955; } :root:not([data-theme="light"]) .hl-n { color: #b5cea8; }
  :root:not([data-theme="light"]) .hl-f { color: #dcdcaa; } :root:not([data-theme="light"]) .hl-h { color: #569cd6; } }
.editor-estado { display: flex; gap: 24px; justify-content: flex-end; padding: 4px 16px; font-size: 12px; color: var(--tenue); border-top: 1px solid var(--borde); }

/* ── Verificador ───────────────────────────────────────────────────── */
.ver { flex: 1; display: grid; grid-template-columns: 170px minmax(0, 1fr); min-height: 0; }
.ver .lado button { justify-content: space-between; }
.ver .lado .faltante { color: var(--tenue); }
.marca { display: inline-block; width: 9px; height: 9px; flex: none; }
.m-ok { border-radius: 50%; background: var(--ok); }
.m-aviso { background: var(--aviso); transform: rotate(45deg) scale(.85); }
.m-error { background: var(--error); }
.m-nada { border: 1.5px solid var(--tenue); border-radius: 50%; }
.ver-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--contenido); }
.ver-barra { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid var(--borde); }
.ver-barra .info { color: var(--tenue); font-size: 12.5px; }
.ver-barra a { color: var(--acento); }
.ver-paneles { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
.ver-fuente { border-right: 1px solid var(--borde); display: flex; flex-direction: column; min-height: 0; background: var(--campo); }
.ver h3 { font-size: 12px; font-weight: 600; color: var(--tenue); padding: 10px 14px 6px; }
.ver-fuente pre { flex: 1; overflow: auto; padding: 0 14px 14px; font: 12.5px/1.45 var(--mono); white-space: pre-wrap; }
.ver-fuente mark { background: #fff100; color: #000; border-radius: 2px; }
.ver-extr { overflow-y: auto; padding-bottom: 18px; }
.ver table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ver th { text-align: left; font-weight: 600; font-size: 12px; color: var(--tenue); padding: 4px 8px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
.ver td { padding: 6px 8px; border-bottom: 1px solid var(--borde); vertical-align: top; }
.ver th:first-child, .ver td:first-child { padding-left: 14px; }
.ver td.n, .ver th.n { text-align: right; white-space: nowrap; }
.ver tbody tr:hover, .ver tbody tr.activa { background: var(--seleccion); }
.ver .vacio { color: var(--tenue); font-style: italic; }
.ver .sub { color: var(--tenue); font-size: 12px; }
.declarado { margin: 0 14px; padding: 8px 12px; border-left: 3px solid var(--acento); background: var(--hover); color: var(--tenue); font-size: 13px; border-radius: 0 4px 4px 0; }
.declarado b { color: var(--texto); }
.reglas li { display: grid; grid-template-columns: 16px 92px minmax(0, 1fr); gap: 6px; align-items: baseline; padding: 6px 14px; font-size: 13px; border-bottom: 1px solid var(--borde); }
.reglas .det { color: var(--tenue); }
.reglas li.error .det { color: var(--texto); }
.nota-ver { padding: 12px 14px 0; color: var(--tenue); font-size: 12px; }
.ausente { padding: 40px 20px; text-align: center; color: var(--tenue); }

/* ── Navegador ─────────────────────────────────────────────────────── */
.nav-pestana { background: var(--contenido); }
.nav-barra { display: flex; gap: 6px; align-items: center; padding: 5px 8px; background: var(--contenido); border-bottom: 1px solid var(--borde); }
.nav-barra .url { flex: 1; min-width: 0; padding: 5px 14px; border-radius: 999px; background: var(--ventana); color: var(--tenue);
  font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-barra .url b { color: var(--texto); font-weight: 400; }
.ventana iframe { flex: 1; width: 100%; border: 0; background: #fff; }

/* ── Teléfono: una ventana a la vez ────────────────────────────────── */
@media (max-width: 760px) {
  .iconos { display: none; }
  .tareas { grid-template-columns: 1fr; justify-items: center; }
  .tareas .apps { grid-column: 1; }
  .bandeja { display: none; }
  .ventana, .ventana.max { inset: 0 0 var(--barra-tareas) 0 !important; width: auto !important; height: auto !important;
    border-radius: 0; resize: none; min-width: 0; }
  .controles .min, .controles .max { display: none; }
  .exp, .ver { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .lado { border-right: 0; border-bottom: 1px solid var(--borde); display: flex; overflow-x: auto; gap: 4px; }
  .lado .grupo { display: none; }
  .lado button { width: auto; white-space: nowrap; }
  .lista th:nth-child(2), .lista td:nth-child(2) { display: none; }
  .ver-paneles { grid-template-columns: minmax(0, 1fr); grid-template-rows: 38% minmax(0, 1fr); }
  .ver-fuente { border-right: 0; border-bottom: 1px solid var(--borde); }
  .ver th:nth-child(2), .ver td:nth-child(2), .ver th:nth-child(7), .ver td:nth-child(7) { display: none; }
  .ver-extr { overflow-x: auto; }
  .reglas li { grid-template-columns: 16px 76px minmax(0, 1fr); }
  .inicio .rejilla-ini { grid-template-columns: repeat(3, 1fr); }
  .inicio .recientes { grid-template-columns: 1fr; }
  .inicio .cuerpo-ini, .inicio .pie-ini { padding-left: 16px; padding-right: 16px; }
  .term { font-size: 13px; }
  .pestana, .nav-pestana { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { .ventana.abriendo, .inicio.abierto { animation: none; } }
</style>
</head>

evidencia", "resultado": "ok", "detalle": "todos los valores aparecen en la página"}, {"edicion": "202609", "etapa": "ingreso", "regla": "fecha_en_mes", "resultado": "ok", "detalle": "todas las fechas caen en 2026-08"}, {"edicion": "202609", "etapa": "ingreso", "regla": "rango", "resultado": "ok", "detalle": "MW > 0 e inversión por MW entre 0,3 y 3 MMUSD"}, {"edicion": "202609", "etapa": "ingreso", "regla": "faltante", "resultado": "aviso", "detalle": "«-» en la fuente: Planta Fotovoltaica El Faro (potencia)"}, {"edicion": "202609", "etapa": "ingreso", "regla": "duplicado", "resultado": "ok", "detalle": "sin repetidos"}, {"edicion": "202609", "etapa": "aprobacion", "regla": "totales", "resultado": "ok", "detalle": "521 MW y 854 MMUSD, igual a lo declarado"}, {"edicion": "202609", "etapa": "aprobacion", "regla": "conteo", "resultado": "ok", "detalle": "8 filas, igual a lo declarado"}, {"edicion": "202609", "etapa": "aprobacion", "regla": "evidencia", "resultado": "ok", "detalle": "todos los valores aparecen en la página"}, {"edicion": "202609", "etapa": "aprobacion", "regla": "fecha_en_mes", "resultado": "ok", "detalle": "todas las fechas caen en 2026-08"}, {"edicion": "202609", "etapa": "aprobacion", "regla": "rango", "resultado": "ok", "detalle": "MW > 0 e inversión por MW entre 0,3 y 3 MMUSD"}, {"edicion": "202609", "etapa": "aprobacion", "regla": "faltante", "resultado": "ok", "detalle": "todas las filas traen potencia e inversión"}, {"edicion": "202609", "etapa": "aprobacion", "regla": "duplicado", "resultado": "ok", "detalle": "sin repetidos"}], "declarado": {"ingreso": {"proyectos": 4, "mw": 245.0, "mmusd": 280.0, "cita": "Durante el mes de agosto, el Sistema de Evaluación Ambiental acogió 4 nuevos proyectos ERNC a calificación. De estos proyectos, 1 corresponde a generación eólica y 3 corresponden a generación solar fotovoltaica; que en su conjunto suman 245 MW, y que equivalen a una inversión de 280 MMUSD."}, "aprobacion": {"proyectos": 8, "mw": 521.0, "mmusd": 854.0, "cita": "Durante el mes de agosto, el Sistema de Evaluación Ambiental otorgó 8 nuevas Resoluciones de Calificación Ambiental (RCA) favorables en proyectos ERNC. De los cuales, 2 proyectos son eólicos y 6 proyectos son solares fotovoltaicos; que en su conjunto suman 521 MW, y que equivalen a una inversión de 854 MMUSD."}}, "intentos": 1, "via": "Claude Code (plan Team), sin clave de API: mismo mensaje y mismo esquema que messages.parse"}], "archivos": [{"ruta": "README.md", "contenido": "# Vigía ERNC\n\nUn agente lee los reportes mensuales ERNC de la Comisión Nacional de Energía (CNE), extrae los proyectos que entran a evaluación ambiental y los que se aprueban, y siete reglas verifican cada número antes de guardarlo. El resultado es una base SQLite, un informe y fichas de proyectos para el área comercial.\n\n**El modelo propone, las reglas verifican.**\n\n## Ver la demo\n\n- **Escritorio** ([fruiz-01.github.io/vigia-ernc](https://fruiz-01.github.io/vigia-ernc/)): el proyecto dentro de un escritorio Windows en el navegador. PowerShell reproduce la salida grabada de cada orden; el verificador muestra el texto de cada página del PDF junto a lo que extrajo el modelo y el resultado de cada regla.\n- **Informe** ([fruiz-01.github.io/vigia-ernc/informe.html](https://fruiz-01.github.io/vigia-ernc/informe.html)): proyectos, verificación por edición y fichas.\n\nAmbas páginas se generan desde la corrida real y no necesitan servidor.\n\n## Qué hace\n\n| Paso | Qué hace |\n|---|---|\n| `descargar` | Baja el PDF de cada mes desde `cne.cl`, guarda su huella SHA-256 y registra las ediciones que no existen. |\n| `extraer` | Ubica las dos páginas con tablas, saca su texto con PyMuPDF y se lo entrega al modelo, que devuelve filas con un esquema fijo (Pydantic). Si los totales o el conteo no cuadran, reintenta una vez con la diferencia concreta. Cada respuesta queda en `datos/extracciones/`. |\n| `validar` | Aplica las siete reglas y guarda filas, texto fuente y controles en `datos/vigia.sqlite`. |\n| `publicar` | Escribe `docs/informe.html`. |\n\nPor qué un modelo y no un lector fijo: las tablas no salen limpias del PDF. Los nombres vienen partidos en varias líneas, con guiones de corte («CANDE-» + «LARIA»), y el formato cambia entre meses (fechas «30-09- 2025» en octubre de 2025, «19/08/2026» en septiembre de 2026).\n\nPor qué un flujo fijo y no un agente autónomo: la tarea tiene pasos conocidos. Un flujo con un solo punto de autocorrección es más barato, predecible y fácil de auditar.\n\n### Las siete reglas\n\n| Regla | Qué revisa | Si falla |\n|---|---|---|\n| Totales | La suma de MW y MMUSD coincide con lo que declara el texto del reporte | Error |\n| Conteo | El número de filas coincide con los proyectos declarados | Error |\n| Evidencia | Cada valor extraído aparece escrito en la página | Error (posible invento del modelo) |\n| Fecha | La fecha cae en el mes que cubre la edición | Error |\n| Rango | MW > 0 e inversión por MW entre 0,3 y 3 MMUSD | Aviso |\n| Faltante | Un dato «-» en la fuente queda vacío, nunca en cero | Aviso |\n| Duplicado | Un proyecto no se repite en la misma etapa | Aviso |\n\n## Resultados de esta corrida\n\nEdiciones de octubre de 2025 a septiembre de 2026.\n\n| | |\n|---|---|\n| Reportes leídos | 11 de 12 (mayo de 2026 no está publicado: HTTP 404) |\n| Filas | 113: 49 ingresos a evaluación (5.267 MW) y 64 aprobaciones (7.630 MW) |\n| Controles | 154: 137 ok, 12 avisos, 5 errores |\n| Reintentos del modelo | 0: las 11 ediciones cuadraron al primer intento |\n| Precisión | 216 de 216 campos correctos contra la transcripción de referencia (octubre 2025 y septiembre 2026, 27 filas) |\n\n### Qué encontraron las reglas\n\nNinguno de los 5 errores es un error de lectura del modelo:\n\n- **Junio y julio de 2026 repiten las tablas de abril** (4 errores de fecha y 2 avisos de duplicado). Las páginas de tablas de ambas ediciones traen los mismos proyectos, con fechas de abril. La fuente no tiene tablas de mayo ni de junio de 2026.\n- **Errata en el PDF de abril de 2026** (1 error de evidencia). El texto dice «suman 3 13 MW». El modelo leyó 313, que es lo que suman las filas (172 + 128 + 13), pero la regla busca el número escrito tal cual y no lo encuentra. Es un falso positivo: se deja a la vista y no se corrige a mano.\n\nLos avisos:\n\n- **6 faltantes**: proyectos con potencia o inversión «-» en la fuente. Quedan vacíos.\n- **4 de rango**: inversiones por MW fuera de 0,3–3 MMUSD. Son plausibles (una minicentral hidroeléctrica a 8 MMUSD/MW, una planta de hidrógeno verde a 4,2) y el rango se puede afinar por tecnología.\n\nOtras inconsistencias de la fuente, transcritas tal cual: «Parque Eólico Las Lilas» viene con tecnología «Solar - PV», y la región aparece como «Interregional» o «Interregion» según la edición.\n\n### Un ajuste que salió de la corrida\n\nEl esquema exigía un número en la inversión. En diciembre de 2025 un proyecto trae la inversión «-», y con ese esquema el modelo se habría visto forzado a inventar un valor. Ahora la inversión admite vacío, igual que la potencia, y la regla de faltantes revisa ambos campos (con prueba incluida).\n\n## Cómo se hizo la lectura en esta versión\n\nEl código llama a la API de Anthropic con `client.messages.parse` (modelo `claude-opus-5-5`, salida validada con el esquema Pydantic). Para esta corrida no había clave de API, así que la lectura la hizo el mismo modelo a través de Claude Code: cada edición recibió exactamente el mensaje que arma `extraer.armar_mensaje()`, sin acceso a las referencias de prueba, y cada respuesta se validó con el mismo esquema y las mismas reglas de reintento antes de guardarse. Cada archivo de `datos/extracciones/` lo indica en su campo `via`.\n\nCon `ANTHROPIC_API_KEY` definida y la carpeta `datos/extracciones/` vacía, `python -m vigia extraer` hace las llamadas por la API. Costo estimado: 11 llamadas de unos 3.000 tokens de entrada, menos de 1 dólar por corrida.\n\n## Cómo correrlo\n\nRequiere Python 3.13.\n\n```\npip install -r requirements.txt\npython -m vigia todo          # descargar, extraer, validar y publicar\npython -m vigia precision     # compara con las referencias de tests/datos\npython -m vigia sql \"SELECT regla, resultado, COUNT(*) FROM controles GROUP BY 1, 2\"\npython -m vigia escritorio    # graba las órdenes y regenera docs/index.html\npytest -q\n```\n\nSin clave de API, `todo` usa las extracciones guardadas: la verificación se puede repetir sin costo.\n\n## Estructura\n\n```\nvigia/\n  descargar.py    PDF de la CNE con su huella\n  leer.py         ubica las páginas con tablas por su contenido\n  extraer.py      esquema, mensaje al modelo y reintento\n  validar.py      las siete reglas\n  base.py         SQLite: reportes, páginas, filas, controles y vista de proyectos\n  publicar.py     informe HTML\n  escritorio.py   escritorio de demostración (plantilla en escritorio.html)\n  precision.py    comparación campo por campo\ntests/            31 pruebas y referencias transcritas del PDF\ndatos/extracciones/   respuestas del modelo (caché)\ndocs/             páginas publicadas\n```\n\n## Límites y siguiente paso\n\n- Una sola fuente. Lo siguiente sería sumar el detalle de cada proyecto en el SEA (MWh de baterías, punto de conexión, fecha de operación) y el Coordinador Eléctrico, que tiene API oficial.\n- Las fichas usan un criterio supuesto (RCA aprobada, con baterías, entre 20 y 300 MW). Es para conversar con el área comercial, no una recomendación.\n- La regla de evidencia es literal: prefiere marcar de más (como la errata de abril) a dejar pasar un valor inventado.\n- Corre con un comando; programarlo cada mes es una línea de cron.\n\n---\n\nFrancisco Ruiz · Ingeniero Civil Industrial · [GitHub](https://github.com/fruiz-01)\n\nDatos públicos de la Comisión Nacional de Energía.\n", "bytes": 7445}, {"ruta": "requirements.txt", "contenido": "pymupdf>=1.24\nanthropic>=0.78\npydantic>=2\npytest>=8\n", "bytes": 52}, {"ruta": "pytest.ini", "contenido": "[pytest]\npythonpath = .\ntestpaths = tests\n", "bytes": 42}, {"ruta": ".gitignore", "contenido": "# PDFs descargados de la CNE (se vuelven a bajar con `python -m vigia descargar`)\ndatos/reportes/\n# base generada\ndatos/vigia.sqlite\n# claves\n.env\n# cachés de Python\n__pycache__/\n*.pyc\n.pytest_cache/\n# borradores locales\nsalida/\n# notas internas\nPLAN.md\n", "bytes": 267}, {"ruta": "vigia/__init__.py", "contenido": "", "bytes": 0}, {"ruta": "vigia/__main__.py", "contenido": "\"\"\"Línea de comandos: python -m vigia <paso>\n\n  todo          descargar + extraer + validar + publicar\n  descargar     baja los reportes mensuales de la CNE\n  extraer       lee las tablas con el modelo (o desde la caché)\n  validar       aplica las siete reglas y guarda en SQLite\n  publicar      escribe el informe en docs/informe.html\n  precision     compara al modelo con la transcripción manual\n  sql \"...\"     consulta la base\n  escritorio    graba las órdenes y escribe docs/index.html\n\"\"\"\nimport json\nimport os\nimport sys\nfrom collections import Counter\nfrom pathlib import Path\n\nfrom vigia import base, descargar, escritorio, extraer, leer, precision, publicar, validar\n\n\ndef paso_descargar(con):\n    print(\"Descargando reportes de la CNE...\")\n    registros = descargar.descargar_todo()\n    base.guardar_reportes(con, registros)\n    faltan = [r[\"edicion\"] for r in registros if r[\"estado\"] == \"faltante\"]\n    print(f\"{len(registros) - len(faltan)} descargados, faltantes: {', '.join(faltan) or 'ninguno'}\")\n\n\ndef ediciones_ok(con):\n    return [r[\"edicion\"] for r in con.execute(\"SELECT edicion FROM reportes WHERE estado = 'ok' ORDER BY edicion\")]\n\n\ndef paso_extraer(con):\n    print(\"Extrayendo tablas con el modelo...\")\n    cliente = None\n    if os.environ.get(\"ANTHROPIC_API_KEY\"):\n        import anthropic\n        cliente = anthropic.Anthropic()\n    for edicion in ediciones_ok(con):\n        if not (extraer.CARPETA / f\"{edicion}.json\").exists() and cliente is None:\n            print(f\"  {edicion}: sin caché y sin ANTHROPIC_API_KEY, se omite\")\n            continue\n        paginas = leer.leer_tablas(descargar.CARPETA / f\"{edicion}.pdf\")\n        try:\n            resultado = extraer.extraer_edicion(edicion, paginas, cliente)\n            via = f\" · leído vía {resultado['via'].split(',')[0]}\" if resultado.get(\"via\") else \"\"\n            print(f\"  {edicion}: {len(resultado['intentos'][-1]['filas'])} filas \"\n                  f\"({len(resultado['intentos'])} intento(s)){via}\")\n        except Exception as e:  # una edición con problemas no detiene el resto\n            print(f\"  {edicion}: ERROR {e}\")\n\n\ndef paso_validar(con):\n    print(\"Validando con las siete reglas...\")\n    resumen, por_regla, reintentos = Counter(), Counter(), 0\n    for edicion in ediciones_ok(con):\n        ruta = extraer.CARPETA / f\"{edicion}.json\"\n        if not ruta.exists():\n            print(f\"  {edicion}: sin extracción, se omite\")\n            continue\n        intentos = json.loads(ruta.read_text(encoding=\"utf-8\"))[\"intentos\"]\n        final = intentos[-1]  # el último intento es el que vale\n        reintentos += len(intentos) - 1\n        paginas = leer.leer_tablas(descargar.CARPETA / f\"{edicion}.pdf\")\n        textos = {etapa: p[\"texto\"] for etapa, p in paginas.items()}\n        controles = validar.validar_edicion(edicion, final, textos, base.filas_previas(con, edicion))\n        base.guardar_edicion(con, edicion, paginas, final[\"filas\"], controles)\n        malos = [c for c in controles if c[\"resultado\"] != \"ok\"]\n        resumen.update(c[\"resultado\"] for c in controles)\n        por_regla.update(f\"{c['regla']} ({c['resultado']})\" for c in malos)\n        print(f\"  {edicion}: {len(final['filas'])} filas, \"\n              f\"{sum(c['resultado'] == 'error' for c in controles)} errores, \"\n              f\"{sum(c['resultado'] == 'aviso' for c in controles)} avisos\")\n        for c in malos:\n            print(f\"      [{c['resultado']}] {c['etapa']} · {c['regla']}: {c['detalle']}\")\n    print(f\"Controles: {dict(resumen)} · reintentos usados: {reintentos}\")\n    for regla, n in sorted(por_regla.items()):\n        print(f\"  {regla}: {n}\")\n\n\ndef paso_precision(con):\n    \"\"\"Compara la extracción del modelo con las referencias transcritas a mano (tests/datos).\"\"\"\n    print(\"Precisión contra la referencia manual...\")\n    for ruta_ref in sorted(Path(\"tests/datos\").glob(\"esperado_*.json\")):\n        edicion = ruta_ref.stem.split(\"_\")[1]\n        ruta = extraer.CARPETA / f\"{edicion}.json\"\n        if not ruta.exists():\n            print(f\"  {edicion}: sin extracción del modelo\")\n            continue\n        referencia = json.loads(ruta_ref.read_text(encoding=\"utf-8\"))[\"filas\"]\n        modelo = json.loads(ruta.read_text(encoding=\"utf-8\"))[\"intentos\"][-1][\"filas\"]\n        aciertos, total, diferencias = precision.comparar(modelo, referencia)\n        print(f\"  {edicion}: {aciertos} de {total} campos correctos\")\n        for d in diferencias:\n            print(f\"      {d}\")\n\n\ndef paso_publicar(con):\n    print(f\"Página escrita en {publicar.publicar(con)}\")\n\n\ndef paso_sql(con, consulta):\n    cursor = con.execute(consulta)\n    columnas = [c[0] for c in cursor.description]\n    filas = [[\"\" if v is None else f\"{v:g}\" if isinstance(v, float) else str(v) for v in f] for f in cursor]\n    anchos = [max(len(x) for x in [col, *(f[i] for f in filas)]) for i, col in enumerate(columnas)]\n    for linea in [columnas, [\"-\" * a for a in anchos], *filas]:\n        print(\"  \".join(x.ljust(a) for x, a in zip(linea, anchos)).rstrip())\n\n\ndef paso_escritorio(con):\n    print(\"Grabando las órdenes de la terminal...\")\n    print(f\"Escritorio escrito en {escritorio.generar()}\")\n\n\ndef paso_vista_previa(con):\n    print(f\"Vista previa escrita en {publicar.vista_previa()}\")\n\n\ndef main(argv):\n    pasos = {\"descargar\": [paso_descargar], \"extraer\": [paso_extraer], \"validar\": [paso_validar],\n             \"publicar\": [paso_publicar], \"todo\": [paso_descargar, paso_extraer, paso_validar, paso_publicar],\n             \"precision\": [paso_precision], \"vista-previa\": [paso_vista_previa],\n             \"escritorio\": [paso_escritorio]}\n    sys.stdout.reconfigure(errors=\"replace\")  # la consola de Windows no siempre acepta tildes y comillas «»\n    if len(argv) == 2 and argv[0] == \"sql\":\n        paso_sql(base.conectar(), argv[1])\n        return 0\n    if len(argv) != 1 or argv[0] not in pasos:\n        print(__doc__)\n        return 1\n    con = base.conectar()\n    for paso in pasos[argv[0]]:\n        paso(con)\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main(sys.argv[1:]))\n", "bytes": 6218}, {"ruta": "vigia/base.py", "contenido": "\"\"\"Base SQLite: reportes, páginas, filas, controles y la vista de proyectos.\"\"\"\nimport sqlite3\nfrom pathlib import Path\n\nfrom vigia.validar import clave\n\nRUTA = Path(\"datos/vigia.sqlite\")\n\nESQUEMA = \"\"\"\nCREATE TABLE IF NOT EXISTS reportes (\n    edicion    TEXT PRIMARY KEY,          -- AAAAMM\n    url        TEXT,\n    sha256     TEXT,\n    descargado TEXT,\n    estado     TEXT                       -- ok | faltante\n);\nCREATE TABLE IF NOT EXISTS paginas (       -- texto fuente, una vez por página\n    edicion TEXT,\n    etapa   TEXT,                          -- ingreso | aprobacion\n    pagina  INTEGER,\n    texto   TEXT,\n    PRIMARY KEY (edicion, etapa)\n);\nCREATE TABLE IF NOT EXISTS filas (\n    edicion        TEXT,\n    etapa          TEXT,                   -- ingreso | aprobacion\n    tecnologia     TEXT,\n    region         TEXT,\n    titular        TEXT,\n    nombre         TEXT,\n    fecha          TEXT,                   -- AAAA-MM-DD\n    potencia_mw    REAL,                   -- NULL si la fuente trae «-»\n    inversion_musd REAL,\n    almacenamiento INTEGER,                -- 0 | 1\n    pagina         INTEGER,\n    clave          TEXT                    -- nombre|titular normalizados\n);\nCREATE TABLE IF NOT EXISTS controles (\n    edicion   TEXT,\n    etapa     TEXT,\n    regla     TEXT,\n    resultado TEXT,                        -- ok | aviso | error\n    detalle   TEXT\n);\nCREATE VIEW IF NOT EXISTS proyectos AS     -- un proyecto puede aparecer en varias ediciones y etapas\n    SELECT clave,\n           MAX(nombre)  AS nombre,\n           MAX(titular) AS titular,\n           MAX(tecnologia) AS tecnologia,\n           MAX(region)  AS region,\n           MAX(CASE WHEN etapa = 'ingreso'    THEN fecha END) AS fecha_ingreso,\n           MAX(CASE WHEN etapa = 'aprobacion' THEN fecha END) AS fecha_aprobacion,\n           MAX(potencia_mw)    AS potencia_mw,\n           MAX(inversion_musd) AS inversion_musd,\n           MAX(almacenamiento) AS almacenamiento,\n           GROUP_CONCAT(edicion || ' ' || etapa, '; ') AS apariciones\n    FROM filas\n    GROUP BY clave;\n\"\"\"\n\n\ndef conectar(ruta=RUTA):\n    if str(ruta) != \":memory:\":\n        Path(ruta).parent.mkdir(parents=True, exist_ok=True)\n    con = sqlite3.connect(ruta)\n    con.row_factory = sqlite3.Row\n    con.executescript(ESQUEMA)\n    return con\n\n\ndef guardar_reportes(con, registros):\n    con.executemany(\n        \"INSERT OR REPLACE INTO reportes VALUES (:edicion, :url, :sha256, :descargado, :estado)\", registros)\n    con.commit()\n\n\ndef guardar_edicion(con, edicion, paginas, filas, controles):\n    \"\"\"Reemplaza todo lo de una edición: así correr dos veces no duplica filas.\"\"\"\n    for tabla in (\"paginas\", \"filas\", \"controles\"):\n        con.execute(f\"DELETE FROM {tabla} WHERE edicion = ?\", (edicion,))\n    con.executemany(\"INSERT INTO paginas VALUES (?, ?, ?, ?)\",\n                    [(edicion, etapa, p[\"pagina\"], p[\"texto\"]) for etapa, p in paginas.items()])\n    con.executemany(\n        \"INSERT INTO filas VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\",\n        [(edicion, f[\"etapa\"], f[\"tecnologia\"], f[\"region\"], f[\"titular\"], f[\"nombre\"], f[\"fecha\"],\n          f[\"potencia_mw\"], f[\"inversion_musd\"], int(f[\"almacenamiento\"]),\n          paginas[f[\"etapa\"]][\"pagina\"], clave(f)) for f in filas])\n    con.executemany(\"INSERT INTO controles VALUES (:edicion, :etapa, :regla, :resultado, :detalle)\", controles)\n    con.commit()\n\n\ndef filas_previas(con, edicion):\n    \"\"\"Filas de ediciones anteriores, para la regla de duplicado.\"\"\"\n    cursor = con.execute(\"SELECT * FROM filas WHERE edicion < ?\", (edicion,))\n    return [dict(f) for f in cursor]\n", "bytes": 3612}, {"ruta": "vigia/descargar.py", "contenido": "\"\"\"Descarga los reportes mensuales ERNC de la CNE.\n\nCada edición se guarda como datos/reportes/AAAAMM.pdf junto con su huella SHA-256.\nSi una edición no existe (o la CNE responde con una página HTML), queda como «faltante»\ny se sigue con la siguiente: un mes caído no detiene la corrida.\n\"\"\"\nimport hashlib\nimport urllib.error\nimport urllib.request\nfrom datetime import datetime\nfrom pathlib import Path\n\nCARPETA = Path(\"datos/reportes\")\nURL = \"https://www.cne.cl/wp-content/uploads/{a}/{m}/RMensual_ERNC_v{a}{m}.pdf\"\n\n\ndef ediciones(desde=\"202510\", hasta=\"202609\"):\n    \"\"\"Lista de ediciones 'AAAAMM' entre dos meses, ambos incluidos.\"\"\"\n    a, m = int(desde[:4]), int(desde[4:])\n    lista = []\n    while f\"{a}{m:02d}\" <= hasta:\n        lista.append(f\"{a}{m:02d}\")\n        a, m = (a + 1, 1) if m == 12 else (a, m + 1)\n    return lista\n\n\ndef url_de(edicion):\n    return URL.format(a=edicion[:4], m=edicion[4:])\n\n\ndef es_pdf(contenido):\n    \"\"\"Un PDF real parte con '%PDF'; una página de error parte con '<!DOCTYPE' o '<html'.\"\"\"\n    return contenido[:5] == b\"%PDF-\"\n\n\ndef descargar_edicion(edicion, carpeta=CARPETA):\n    \"\"\"Descarga una edición y devuelve el registro para la tabla `reportes`.\"\"\"\n    url = url_de(edicion)\n    registro = {\"edicion\": edicion, \"url\": url, \"sha256\": None,\n                \"descargado\": None, \"estado\": \"faltante\"}\n    ruta = carpeta / f\"{edicion}.pdf\"\n\n    if ruta.exists():  # ya bajado antes: no se vuelve a pedir a la CNE\n        contenido = ruta.read_bytes()\n    else:\n        try:\n            pedido = urllib.request.Request(url, headers={\"User-Agent\": \"Mozilla/5.0 (vigia-ernc)\"})\n            with urllib.request.urlopen(pedido, timeout=60) as respuesta:\n                contenido = respuesta.read()\n        except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as e:\n            print(f\"  {edicion}: faltante ({e})\")\n            return registro\n        if not es_pdf(contenido):\n            print(f\"  {edicion}: faltante (la respuesta no es un PDF)\")\n            return registro\n        carpeta.mkdir(parents=True, exist_ok=True)\n        ruta.write_bytes(contenido)\n\n    registro[\"sha256\"] = hashlib.sha256(contenido).hexdigest()\n    registro[\"descargado\"] = datetime.fromtimestamp(ruta.stat().st_mtime).isoformat(timespec=\"seconds\")\n    registro[\"estado\"] = \"ok\"\n    print(f\"  {edicion}: ok ({len(contenido) // 1024} KB, sha256 {registro['sha256'][:12]}...)\")\n    return registro\n\n\ndef descargar_todo(lista=None):\n    return [descargar_edicion(e) for e in (lista or ediciones())]\n", "bytes": 2542}, {"ruta": "vigia/escritorio.py", "contenido": "\"\"\"Escritorio de demostración: el proyecto dentro de un escritorio Windows, en una sola página.\n\nPensado para quien revisa la postulación sin instalar nada. Todo lo que muestra\nsale de la corrida real:\n- la terminal reproduce la salida grabada de cada orden (se graban al generar),\n- el verificador muestra el texto de cada página junto a lo que extrajo el modelo\n  y el resultado de las siete reglas, leídos de la base,\n- los archivos y el editor muestran el código del repositorio tal cual.\n\npython -m vigia escritorio  ->  graba las órdenes y escribe docs/index.html\n\"\"\"\nimport json\nimport os\nimport subprocess\nimport sys\nfrom datetime import date\nfrom pathlib import Path\n\nfrom vigia import base, extraer\n\nPLANTILLA = Path(__file__).with_name(\"escritorio.html\")\nDESTINO = Path(\"docs/index.html\")\n\n# Datos de contacto que se muestran en el menú Inicio (vacío = no se muestra)\nAUTOR = {\n    \"nombre\": \"Francisco Ruiz\",\n    \"cargo\": \"Ingeniero Civil Industrial\",\n    \"correo\": \"\",\n    \"linkedin\": \"\",\n    \"github\": \"https://github.com/fruiz-01\",\n    \"repo\": \"https://github.com/fruiz-01/vigia-ernc\",\n}\n\n# Orden tal como se escribe en la terminal -> argumentos para el intérprete\nORDENES = {\n    \"python -m vigia\": [\"-m\", \"vigia\"],\n    \"python -m vigia todo\": [\"-m\", \"vigia\", \"todo\"],\n    \"python -m vigia descargar\": [\"-m\", \"vigia\", \"descargar\"],\n    \"python -m vigia extraer\": [\"-m\", \"vigia\", \"extraer\"],\n    \"python -m vigia validar\": [\"-m\", \"vigia\", \"validar\"],\n    \"python -m vigia publicar\": [\"-m\", \"vigia\", \"publicar\"],\n    \"python -m vigia precision\": [\"-m\", \"vigia\", \"precision\"],\n    \"pytest -q\": [\"-m\", \"pytest\", \"-q\", \"-p\", \"no:cacheprovider\"],\n}\n\nCONSULTAS = [\n    \"SELECT etapa, COUNT(*) AS filas, SUM(potencia_mw) AS mw, SUM(inversion_musd) AS mmusd FROM filas GROUP BY etapa\",\n    \"SELECT regla, resultado, COUNT(*) AS n FROM controles GROUP BY regla, resultado ORDER BY regla\",\n    \"SELECT nombre, region, potencia_mw FROM filas WHERE etapa = 'aprobacion' AND almacenamiento = 1 \"\n    \"ORDER BY potencia_mw DESC LIMIT 6\",\n]\nfor consulta in CONSULTAS:\n    ORDENES[f'python -m vigia sql \"{consulta}\"'] = [\"-m\", \"vigia\", \"sql\", consulta]\n\n# Archivos del repositorio que se pueden abrir en el escritorio\nARCHIVOS = [\"README.md\", \"requirements.txt\", \"pytest.ini\", \".gitignore\", \"vigia/*.py\",\n            \"tests/*.py\", \"tests/datos/*.json\", \"datos/extracciones/*.json\"]\n\n\ndef grabar():\n    \"\"\"Corre cada orden y guarda su salida, tal como la vería quien la escribe.\"\"\"\n    entorno = {**os.environ, \"PYTHONIOENCODING\": \"utf-8\"}\n    salidas = {}\n    for orden, argumentos in ORDENES.items():\n        r = subprocess.run([sys.executable, *argumentos], capture_output=True, text=True,\n                           encoding=\"utf-8\", env=entorno)\n        salidas[orden] = (r.stdout + r.stderr).rstrip(\"\\n\")\n    return salidas\n\n\ndef archivos():\n    lista = []\n    for patron in ARCHIVOS:\n        for ruta in sorted(Path(\".\").glob(patron)):\n            lista.append({\"ruta\": ruta.as_posix(), \"contenido\": ruta.read_text(encoding=\"utf-8\")})\n    for pdf in sorted(Path(\"datos/reportes\").glob(\"*.pdf\")):\n        lista.append({\"ruta\": pdf.as_posix(), \"tipo\": \"pdf\"})\n    lista += [{\"ruta\": \"datos/vigia.sqlite\", \"tipo\": \"base\"},\n              {\"ruta\": \"docs/informe.html\", \"tipo\": \"web\"},\n              {\"ruta\": \"docs/index.html\", \"tipo\": \"esta\"}]\n    for a in lista:\n        ruta = Path(a[\"ruta\"])\n        a[\"bytes\"] = ruta.stat().st_size if ruta.exists() else None\n    return lista\n\n\ndef ediciones(con):\n    reportes = [dict(r) for r in con.execute(\"SELECT * FROM reportes ORDER BY edicion\")]\n    salida = []\n    for r in reportes:\n        e = r[\"edicion\"]\n        paginas = {p[\"etapa\"]: {\"pagina\": p[\"pagina\"], \"texto\": p[\"texto\"]}\n                   for p in con.execute(\"SELECT * FROM paginas WHERE edicion = ?\", (e,))}\n        filas = [dict(f) for f in con.execute(\"SELECT * FROM filas WHERE edicion = ? ORDER BY rowid\", (e,))]\n        controles = [dict(c) for c in con.execute(\"SELECT * FROM controles WHERE edicion = ? ORDER BY rowid\", (e,))]\n        cache = extraer.CARPETA / f\"{e}.json\"\n        declarado, intentos, via = {}, 0, None\n        if cache.exists():\n            datos = json.loads(cache.read_text(encoding=\"utf-8\"))\n            final = datos[\"intentos\"][-1]\n            declarado = {etapa: final[f\"declarado_{etapa}\"] for etapa in (\"ingreso\", \"aprobacion\")}\n            intentos, via = len(datos[\"intentos\"]), datos.get(\"via\")\n        salida.append({\"edicion\": e, \"estado\": r[\"estado\"], \"url\": r[\"url\"], \"sha256\": r[\"sha256\"],\n                       \"paginas\": paginas, \"filas\": filas, \"controles\": controles,\n                       \"declarado\": declarado, \"intentos\": intentos, \"via\": via})\n    return salida\n\n\ndef generar(destino=DESTINO):\n    salidas = grabar()  # primero: `todo` y `publicar` regeneran la base y el informe\n    con = base.conectar()\n    datos = {\"generado\": date.today().isoformat(), \"modelo\": extraer.MODELO, \"autor\": AUTOR,\n             \"consultas\": CONSULTAS, \"ediciones\": ediciones(con), \"archivos\": archivos(),\n             \"terminal\": salidas}\n    # «<\/» dentro de un <script> cerraría la etiqueta antes de tiempo\n    incrustado = json.dumps(datos, ensure_ascii=False).replace(\"<\/\", \"<\\\\/\")\n    html = PLANTILLA.read_text(encoding=\"utf-8\").replace(\"/*DATOS*/{}\", incrustado)\n    destino = Path(destino)\n    destino.parent.mkdir(parents=True, exist_ok=True)\n    destino.write_text(html, encoding=\"utf-8\")\n    return destino\n", "bytes": 5602}, {"ruta": "vigia/extraer.py", "contenido": "\"\"\"Lee las tablas con un modelo de lenguaje y guarda la respuesta en caché.\n\nEl modelo recibe el texto de las dos páginas y devuelve un JSON con forma fija\n(esquema Pydantic). Si las filas no cuadran con los totales o el conteo que el\npropio reporte declara, se le devuelve la diferencia concreta y se reintenta una\nsola vez. Cada respuesta queda en datos/extracciones/AAAAMM.json: con la caché,\nvolver a validar no necesita clave ni cuesta nada.\n\nPara llamar al modelo hace falta la variable de entorno ANTHROPIC_API_KEY.\nSin ella, `python -m vigia extraer` solo usa las extracciones ya guardadas.\n\"\"\"\nimport json\nfrom datetime import date\nfrom pathlib import Path\nfrom typing import Literal\n\nfrom pydantic import BaseModel, Field\n\nfrom vigia import validar\n\nCARPETA = Path(\"datos/extracciones\")\nMODELO = \"claude-opus-5-5\"\n\n\n# --- Esquema de la respuesta ------------------------------------------------\n\nclass Fila(BaseModel):\n    etapa: Literal[\"ingreso\", \"aprobacion\"]\n    tecnologia: str = Field(description=\"Tal como aparece, p. ej. 'Eólica' o 'Solar - PV'\")\n    region: str = Field(description=\"Número romano, 'RM' o 'Interregional'\")\n    titular: str\n    nombre: str\n    fecha: date = Field(description=\"Fecha de ingreso o aprobación, en formato AAAA-MM-DD\")\n    potencia_mw: float | None = Field(description=\"null si la celda trae '-'\")\n    inversion_musd: float | None = Field(description=\"null si la celda trae '-'\")\n    almacenamiento: bool = Field(description=\"true si la columna dice 'Si'\")\n\n\nclass Declarado(BaseModel):\n    \"\"\"Totales que el texto del reporte declara para una tabla.\"\"\"\n    proyectos: int\n    mw: float\n    mmusd: float\n    cita: str = Field(description=\"Frase textual del reporte de donde salen los tres números\")\n\n\nclass Extraccion(BaseModel):\n    filas: list[Fila]\n    declarado_ingreso: Declarado\n    declarado_aprobacion: Declarado\n\n\nINSTRUCCIONES = \"\"\"Eres un asistente que transcribe tablas del Reporte Mensual ERNC de la Comisión Nacional de Energía de Chile.\n\nAbajo va el texto de dos páginas extraído de un PDF. Cada página trae una tabla:\n- «Proyectos Ingresados a Evaluación Ambiental» (etapa \"ingreso\")\n- «Proyectos con RCA Aprobada» (etapa \"aprobacion\")\n\nEl texto viene desordenado: cada celda está en su propia línea, y los nombres y titulares largos\nestán partidos en varias líneas, a veces con guion de corte («CANDE-» + «LARIA» = «CANDELARIA»).\nColumnas de cada fila: Tecnología, Región, Titular, Nombre, Fecha, Potencia [MW], Inversión [MMUSD],\nWEB («Ver», se ignora) y Almacenamiento («Si»/«No»).\n\nReglas:\n1. Una fila por proyecto de cada tabla, sin omitir ni inventar ninguna.\n2. Copia titular y nombre tal como están, uniendo las líneas partidas y quitando el guion de corte.\n3. Fechas en formato AAAA-MM-DD, vengan como «19/08/2026» o «30-09- 2025».\n4. Si la potencia o la inversión es «-», devuelve null (no 0).\n5. Los números usan punto de miles: «1.248» es 1248.\n6. Para cada tabla, el párrafo de arriba declara cuántos proyectos hubo y cuántos MW y MMUSD suman.\n   Devuelve esos tres números y la frase textual de donde salen. No los calcules tú.\n\"\"\"\n\n\ndef armar_mensaje(paginas):\n    \"\"\"Texto del mensaje: instrucciones más el texto de cada página.\"\"\"\n    partes = [INSTRUCCIONES]\n    for etapa, p in paginas.items():\n        partes.append(f\"\\n=== Página {p['pagina']} (tabla de {etapa}) ===\\n{p['texto']}\")\n    return \"\\n\".join(partes)\n\n\ndef llamar_modelo(cliente, mensajes):\n    \"\"\"Una llamada a la API. Devuelve una Extraccion o lanza error si no sirve.\"\"\"\n    respuesta = cliente.messages.parse(\n        model=MODELO,\n        max_tokens=16000,\n        messages=mensajes,\n        output_format=Extraccion,\n        output_config={\"effort\": \"low\"},\n    )\n    # Antes de leer la respuesta: ¿terminó bien?\n    if respuesta.stop_reason in (\"refusal\", \"max_tokens\"):\n        raise RuntimeError(f\"El modelo no completó la respuesta (stop_reason={respuesta.stop_reason})\")\n    if respuesta.parsed_output is None:\n        raise RuntimeError(\"La respuesta no trae una extracción válida\")\n    return respuesta.parsed_output\n\n\ndef diferencias(extraccion):\n    \"\"\"Fallas de las reglas que gatillan reintento (totales y conteo), en texto.\"\"\"\n    datos = extraccion.model_dump(mode=\"json\")\n    fallas = []\n    for etapa in (\"ingreso\", \"aprobacion\"):\n        filas = [f for f in datos[\"filas\"] if f[\"etapa\"] == etapa]\n        declarado = datos[f\"declarado_{etapa}\"]\n        for control in (validar.totales(filas, declarado), validar.conteo(filas, declarado)):\n            if control[\"resultado\"] == \"error\":\n                fallas.append(f\"Tabla de {etapa}: {control['detalle']}\")\n    return fallas\n\n\ndef extraer_edicion(edicion, paginas, cliente, carpeta=CARPETA):\n    \"\"\"Extrae una edición, con un reintento si no cuadra. Usa la caché si existe.\"\"\"\n    ruta = carpeta / f\"{edicion}.json\"\n    if ruta.exists():\n        return json.loads(ruta.read_text(encoding=\"utf-8\"))\n\n    mensajes = [{\"role\": \"user\", \"content\": armar_mensaje(paginas)}]\n    intentos = [llamar_modelo(cliente, mensajes)]\n\n    fallas = diferencias(intentos[0])\n    if fallas:  # un solo reintento, entregando la diferencia concreta\n        print(f\"  {edicion}: reintento por {len(fallas)} diferencia(s)\")\n        mensajes += [\n            {\"role\": \"assistant\", \"content\": intentos[0].model_dump_json()},\n            {\"role\": \"user\", \"content\": \"Tu extracción no cuadra con lo que declara el reporte:\\n- \"\n             + \"\\n- \".join(fallas)\n             + \"\\nRevisa el texto de nuevo y devuelve la extracción completa corregida.\"},\n        ]\n        intentos.append(llamar_modelo(cliente, mensajes))\n\n    resultado = {\n        \"edicion\": edicion,\n        \"modelo\": MODELO,\n        \"paginas\": {etapa: p[\"pagina\"] for etapa, p in paginas.items()},\n        # se guardan todos los intentos; el último es el que vale\n        \"intentos\": [i.model_dump(mode=\"json\") for i in intentos],\n    }\n    carpeta.mkdir(parents=True, exist_ok=True)\n    ruta.write_text(json.dumps(resultado, ensure_ascii=False, indent=2), encoding=\"utf-8\")\n    return resultado\n", "bytes": 6268}, {"ruta": "vigia/leer.py", "contenido": "\"\"\"Ubica en el PDF las dos páginas con tablas y devuelve su texto.\n\nLa página cambia entre ediciones (6-7 o 7-8), así que se busca por contenido:\nla página de la tabla es la que trae el título de la sección y el encabezado\n«Titular del proyecto». El índice (página 3) nombra las secciones pero no trae\nla tabla, por eso hace falta la segunda condición.\n\"\"\"\nimport fitz  # PyMuPDF\n\n# etapa -> título de la sección en el reporte\nTITULOS = {\n    \"ingreso\": \"Proyectos Ingresados a Evaluación Ambiental\",\n    \"aprobacion\": \"Proyectos con RCA Aprobada\",\n}\n\n\ndef etapa_de_pagina(texto):\n    \"\"\"Devuelve 'ingreso', 'aprobacion' o None según lo que contiene la página.\"\"\"\n    if \"Titular del proyecto\" not in texto:\n        return None\n    for etapa, titulo in TITULOS.items():\n        if titulo in texto:\n            return etapa\n    return None\n\n\ndef leer_tablas(ruta_pdf):\n    \"\"\"{etapa: {\"pagina\": n, \"texto\": str}} para las dos tablas del reporte.\"\"\"\n    paginas = {}\n    with fitz.open(ruta_pdf) as pdf:\n        for i, pagina in enumerate(pdf, start=1):\n            texto = pagina.get_text()\n            etapa = etapa_de_pagina(texto)\n            if etapa and etapa not in paginas:\n                paginas[etapa] = {\"pagina\": i, \"texto\": texto}\n    faltan = set(TITULOS) - set(paginas)\n    if faltan:\n        raise ValueError(f\"{ruta_pdf}: no se encontró la tabla de {', '.join(sorted(faltan))}\")\n    return paginas\n", "bytes": 1431}, {"ruta": "vigia/precision.py", "contenido": "\"\"\"Compara lo que extrajo el modelo con una referencia transcrita a mano, campo por campo.\"\"\"\nfrom vigia.validar import normalizar\n\nCAMPOS = [\"tecnologia\", \"region\", \"titular\", \"nombre\", \"fecha\",\n          \"potencia_mw\", \"inversion_musd\", \"almacenamiento\"]\n\n\ndef igual(a, b):\n    \"\"\"Textos se comparan normalizados (espacios, guiones, tildes); el resto, tal cual.\"\"\"\n    if isinstance(a, str) and isinstance(b, str):\n        return normalizar(a) == normalizar(b)\n    return a == b\n\n\ndef comparar(extraidas, referencia):\n    \"\"\"Devuelve (aciertos, total, diferencias). Las filas se emparejan por etapa y nombre.\n\n    Una fila de la referencia que el modelo omitió cuenta todos sus campos como errores.\n    \"\"\"\n    por_nombre = {(f[\"etapa\"], normalizar(f[\"nombre\"])): f for f in extraidas}\n    aciertos, total, emparejadas, diferencias = 0, 0, 0, []\n    for ref in referencia:\n        fila = por_nombre.get((ref[\"etapa\"], normalizar(ref[\"nombre\"])))\n        if fila is None:\n            total += len(CAMPOS)\n            diferencias.append(f\"{ref['nombre']}: el modelo omitió la fila\")\n            continue\n        emparejadas += 1\n        for campo in CAMPOS:\n            total += 1\n            if igual(fila[campo], ref[campo]):\n                aciertos += 1\n            else:\n                diferencias.append(f\"{ref['nombre']} · {campo}: modelo {fila[campo]!r}, referencia {ref[campo]!r}\")\n    if len(extraidas) > emparejadas:\n        diferencias.append(f\"{len(extraidas) - emparejadas} fila(s) extraída(s) que no están en la referencia\")\n    return aciertos, total, diferencias\n", "bytes": 1586}, {"ruta": "vigia/publicar.py", "contenido": "\"\"\"Genera la página del informe: un solo HTML estático, listo para GitHub Pages.\n\n    publicar(con, ruta)   lee la base (reportes, filas, controles) y escribe el HTML\n    vista_previa()        arma una base en memoria con las ediciones transcritas a mano\n                          (tests/datos) para ver la página antes de correr el modelo\n\"\"\"\nimport json\nfrom datetime import date\nfrom html import escape\nfrom pathlib import Path\n\nfrom vigia import base, descargar, leer, validar\n\n# Regiones de norte a sur: el orden de los gráficos sigue la geografía de Chile.\nREGIONES = {\n    \"XV\": \"Arica y Parinacota\", \"I\": \"Tarapacá\", \"II\": \"Antofagasta\", \"III\": \"Atacama\",\n    \"IV\": \"Coquimbo\", \"V\": \"Valparaíso\", \"RM\": \"Metropolitana\", \"VI\": \"O'Higgins\",\n    \"VII\": \"Maule\", \"XVI\": \"Ñuble\", \"VIII\": \"Biobío\", \"IX\": \"Araucanía\", \"XIV\": \"Los Ríos\",\n    \"X\": \"Los Lagos\", \"XI\": \"Aysén\", \"XII\": \"Magallanes\",\n}\nMESES = [\"enero\", \"febrero\", \"marzo\", \"abril\", \"mayo\", \"junio\", \"julio\", \"agosto\",\n         \"septiembre\", \"octubre\", \"noviembre\", \"diciembre\"]\nNOMBRE_REGLA = {\"totales\": \"Totales\", \"conteo\": \"Conteo\", \"evidencia\": \"Evidencia\", \"fecha_en_mes\": \"Fecha\",\n                \"rango\": \"Rango\", \"faltante\": \"Faltante\", \"duplicado\": \"Duplicado\"}\nGRAVEDAD = {\"ok\": 0, \"aviso\": 1, \"error\": 2}\nTECNOLOGIAS = {\"solar\": \"Solar\", \"eolica\": \"Eólica\", \"mixto\": \"Mixto\", \"otra\": \"Otra\"}\n\n# Fichas: supuestos para conversar con el área de Mercados, no verdades.\nFICHA_MW_MIN, FICHA_MW_MAX, FICHAS = 20, 300, 6\n\n\n# ── Formatos ────────────────────────────────────────────────────────────────\n\ndef numero(valor, decimales=0):\n    \"\"\"Formato chileno: 1.234,5\"\"\"\n    if valor is None:\n        return \"—\"\n    texto = f\"{valor:,.{decimales}f}\"\n    return texto.replace(\",\", \"_\").replace(\".\", \",\").replace(\"_\", \".\")\n\n\ndef edicion_larga(edicion):\n    return f\"{MESES[int(edicion[4:]) - 1]} {edicion[:4]}\"\n\n\ndef fecha_corta(iso):\n    if not iso:\n        return \"—\"\n    d = date.fromisoformat(iso)\n    return f\"{d.day} {MESES[d.month - 1][:3]} {d.year}\"\n\n\ndef region(codigo):\n    return REGIONES.get(codigo, codigo)\n\n\ndef tecnologia(texto):\n    \"\"\"Agrupa las variantes que trae la fuente («Solar - PV», «Solar -  PV», «Eólica», «Mixto»).\"\"\"\n    t = (texto or \"\").lower()\n    if \"solar\" in t or \"fotovolt\" in t:\n        return \"solar\"\n    if \"eól\" in t or \"eol\" in t:\n        return \"eolica\"\n    if \"mixt\" in t:\n        return \"mixto\"\n    return \"otra\"\n\n\ndef punto(clave_tecnologia):\n    return f'<i class=\"punto t-{clave_tecnologia}\"><\/i>'\n\n\ndef marca(resultado):\n    nombres = {\"ok\": \"sin observaciones\", \"aviso\": \"aviso\", \"error\": \"error\"}\n    return f'<i class=\"m m-{resultado}\" title=\"{nombres[resultado]}\"><\/i><span class=\"sr\">{nombres[resultado]}<\/span>'\n\n\n# ── Lectura de la base ──────────────────────────────────────────────────────\n\ndef leer_base(con):\n    reportes = [dict(r) for r in con.execute(\"SELECT * FROM reportes ORDER BY edicion\")]\n    filas = [dict(f) for f in con.execute(\"SELECT * FROM filas ORDER BY fecha DESC, nombre\")]\n    controles = [dict(c) for c in con.execute(\"SELECT * FROM controles\")]\n    return reportes, filas, controles\n\n\ndef fichas(filas):\n    \"\"\"Aprobados con baterías y tamaño intermedio, de mayor a menor potencia.\"\"\"\n    candidatos = [f for f in filas if f[\"etapa\"] == \"aprobacion\" and f[\"almacenamiento\"]\n                  and f[\"potencia_mw\"] and FICHA_MW_MIN <= f[\"potencia_mw\"] <= FICHA_MW_MAX]\n    unicos = {}\n    for f in sorted(candidatos, key=lambda f: -f[\"potencia_mw\"]):\n        unicos.setdefault(f[\"clave\"], f)  # una ficha por proyecto, aunque se repita en otra edición\n    return list(unicos.values())[:FICHAS]\n\n\n# ── Bloques de la página ────────────────────────────────────────────────────\n\ndef bloque_cifras(reportes, filas, controles):\n    leidas = sorted({f[\"edicion\"] for f in filas})\n    mw = sum(f[\"potencia_mw\"] or 0 for f in filas)\n    errores = sum(c[\"resultado\"] == \"error\" for c in controles)\n    avisos = sum(c[\"resultado\"] == \"aviso\" for c in controles)\n    cifra = lambda v, d=0: f'<span data-cuenta=\"{v}\" data-decimales=\"{d}\">{numero(v, d)}<\/span>'\n    return f\"\"\"\n    <dl class=\"cifras\">\n      <div><dt>Filas leídas<\/dt><dd>{cifra(len(filas))}<\/dd><dd class=\"nota\">{len(leidas)} de {len(reportes)} ediciones<\/dd><\/div>\n      <div><dt>Potencia<\/dt><dd>{cifra(mw)} <small>MW<\/small><\/dd><dd class=\"nota\">ingresos y aprobaciones<\/dd><\/div>\n      <div><dt>Controles<\/dt><dd>{cifra(len(controles))}<\/dd><dd class=\"nota\">7 reglas por tabla<\/dd><\/div>\n      <div><dt>Observaciones<\/dt><dd><span class=\"{'rojo' if errores else 'verde'}\">{cifra(errores)}<\/span> <small>errores<\/small> · <span class=\"ambar\">{cifra(avisos)}<\/span> <small>avisos<\/small><\/dd><dd class=\"nota\">cada una explicada abajo<\/dd><\/div>\n    <\/dl>\"\"\"\n\n\ndef grafico_regiones(filas):\n    \"\"\"Barras horizontales por región, de norte a sur, apiladas por tecnología.\"\"\"\n    por_region = {}\n    for f in filas:\n        if f[\"potencia_mw\"]:\n            t = tecnologia(f[\"tecnologia\"])\n            por_region.setdefault(f[\"region\"], {}).setdefault(t, 0)\n            por_region[f[\"region\"]][t] += f[\"potencia_mw\"]\n    if not por_region:\n        return \"\"\n    maximo = max(sum(v.values()) for v in por_region.values())\n    orden = [r for r in REGIONES if r in por_region] + [r for r in por_region if r not in REGIONES]\n    filas_html = []\n    for k, r in enumerate(orden):\n        tramos = \"\".join(\n            f'<span class=\"t-{t}\" style=\"width:{mw / maximo * 100:.2f}%\" title=\"{TECNOLOGIAS[t]}: {numero(mw)} MW\"><\/span>'\n            for t, mw in sorted(por_region[r].items(), key=lambda x: list(TECNOLOGIAS).index(x[0])))\n        filas_html.append(f'<div class=\"region\"><span class=\"nombre\">{region(r)}<\/span>'\n                          f'<span class=\"pista\" style=\"--i:{k}\">{tramos}<\/span>'\n                          f'<span class=\"valor\">{numero(sum(por_region[r].values()))}<\/span><\/div>')\n    return f\"\"\"\n      <figure class=\"grafico\">\n        <figcaption>Potencia por región, de norte a sur <span>MW<\/span><\/figcaption>\n        <div class=\"regiones\">{\"\".join(filas_html)}<\/div>\n      <\/figure>\"\"\"\n\n\ndef grafico_meses(reportes, filas):\n    \"\"\"Columnas por edición: ingresos y aprobados. Las ediciones sin datos quedan a la vista.\"\"\"\n    suma = {}\n    for f in filas:\n        suma.setdefault(f[\"edicion\"], {\"ingreso\": 0, \"aprobacion\": 0})[f[\"etapa\"]] += f[\"potencia_mw\"] or 0\n    maximo = max([v for s in suma.values() for v in s.values()] + [1])\n    columnas = []\n    for k, r in enumerate(reportes):\n        ed = r[\"edicion\"]\n        etiqueta = f'{MESES[int(ed[4:]) - 1][:3]}<br><span>{ed[2:4]}<\/span>'\n        if r[\"estado\"] == \"faltante\":\n            cuerpo, clase, titulo = \"\", \" falta\", \"no está publicado\"\n        elif ed not in suma:\n            cuerpo, clase, titulo = \"\", \" pendiente\", \"espera la lectura del modelo\"\n        else:\n            s = suma[ed]\n            cuerpo = (f'<span class=\"barra e-ingreso\" style=\"height:{s[\"ingreso\"] / maximo * 100:.1f}%;--i:{k}\"><\/span>'\n                      f'<span class=\"barra e-aprobacion\" style=\"height:{s[\"aprobacion\"] / maximo * 100:.1f}%;--i:{k}\"><\/span>')\n            clase, titulo = \"\", f'ingresos {numero(s[\"ingreso\"])} MW · aprobados {numero(s[\"aprobacion\"])} MW'\n        columnas.append(f'<div class=\"mes{clase}\" title=\"{edicion_larga(ed)}: {titulo}\"><div class=\"area\">{cuerpo}<\/div>'\n                        f'<div class=\"etiqueta\">{etiqueta}<\/div><\/div>')\n    return f\"\"\"\n      <figure class=\"grafico\">\n        <figcaption>Potencia por edición del reporte <span>MW<\/span><\/figcaption>\n        <div class=\"meses\">{\"\".join(columnas)}<\/div>\n        <p class=\"leyenda\"><span><i class=\"cuadro e-ingreso\"><\/i>Ingresa a evaluación<\/span><span><i class=\"cuadro e-aprobacion\"><\/i>Aprobado<\/span><span><i class=\"cuadro rayado\"><\/i>Sin datos<\/span><\/p>\n      <\/figure>\"\"\"\n\n\ndef bloque_graficos(reportes, filas):\n    leyenda = \"\".join(f\"<span>{punto(t)}{n}<\/span>\" for t, n in TECNOLOGIAS.items()\n                      if any(tecnologia(f[\"tecnologia\"]) == t for f in filas))\n    return f\"\"\"\n    <section>\n      <div class=\"graficos\">\n        {grafico_regiones(filas)}\n        {grafico_meses(reportes, filas)}\n      <\/div>\n      <p class=\"leyenda\">{leyenda}<\/p>\n    <\/section>\"\"\"\n\n\ndef bloque_verificacion(reportes, controles):\n    encabezado = \"\".join(f\"<th>{n}<\/th>\" for n in NOMBRE_REGLA.values())\n    filas_html, detalles = [], []\n    for r in reportes:\n        ed = r[\"edicion\"]\n        propios = [c for c in controles if c[\"edicion\"] == ed]\n        clase = \"\"\n        if r[\"estado\"] == \"faltante\":\n            celdas = '<td colspan=\"7\">No está publicado en la dirección esperada; se registra y se sigue<\/td>'\n            estado, clase = '<span class=\"etiqueta-estado rojo\">Falta<\/span>', ' class=\"falta\"'\n        elif not propios:\n            celdas = '<td colspan=\"7\">Descargado; espera la lectura del modelo<\/td>'\n            estado, clase = '<span class=\"etiqueta-estado\">Pendiente<\/span>', ' class=\"pendiente\"'\n        else:\n            celdas = \"\"\n            for regla in NOMBRE_REGLA:\n                peor = max((c[\"resultado\"] for c in propios if c[\"regla\"] == regla), key=GRAVEDAD.get, default=\"ok\")\n                celdas += f'<td class=\"c\">{marca(peor)}<\/td>'\n            n_err = sum(c[\"resultado\"] == \"error\" for c in propios)\n            estado = (f'<span class=\"etiqueta-estado rojo\">{n_err} error{\"es\" if n_err > 1 else \"\"}<\/span>' if n_err\n                      else '<span class=\"etiqueta-estado verde\">Verificado<\/span>')\n            for c in propios:\n                if c[\"resultado\"] != \"ok\":\n                    detalles.append(f'<li>{marca(c[\"resultado\"])}<b>{edicion_larga(ed)}<\/b> · '\n                                    f'{\"ingresos\" if c[\"etapa\"] == \"ingreso\" else \"aprobados\"} · '\n                                    f'{NOMBRE_REGLA[c[\"regla\"]]}: {escape(c[\"detalle\"])}<\/li>')\n        filas_html.append(f'<tr{clase}><td class=\"ed\">{edicion_larga(ed)}<\/td><td>{estado}<\/td>{celdas}<\/tr>')\n    lista = f'<ul class=\"detalles\">{\"\".join(detalles)}<\/ul>' if detalles else \"\"\n    return f\"\"\"\n    <section>\n      <h2>Verificación<\/h2>\n      <div class=\"tabla\"><table class=\"verificacion\">\n        <thead><tr><th>Edición<\/th><th>Estado<\/th>{encabezado}<\/tr><\/thead>\n        <tbody>{\"\".join(filas_html)}<\/tbody>\n      <\/table><\/div>\n      {lista}\n    <\/section>\"\"\"\n\n\ndef bloque_fichas(seleccion, reportes):\n    url = {r[\"edicion\"]: r[\"url\"] for r in reportes}\n    if not seleccion:\n        return \"\"\n    piezas = []\n    for k, f in enumerate(seleccion):\n        t = tecnologia(f[\"tecnologia\"])\n        intensidad = f[\"inversion_musd\"] / f[\"potencia_mw\"] if f[\"inversion_musd\"] is not None else None\n        fuera = intensidad is not None and not (0.3 <= intensidad <= 3.0)\n        piezas.append(f\"\"\"\n      <article class=\"ficha f-{t}\" style=\"--i:{k}\">\n        <p class=\"meta\">{punto(t)}{TECNOLOGIAS[t]} · {region(f[\"region\"])} · aprobado el {fecha_corta(f[\"fecha\"])}<\/p>\n        <h3>{escape(f[\"nombre\"])}<\/h3>\n        <p class=\"titular\">{escape(f[\"titular\"])}<\/p>\n        <dl class=\"datos\">\n          <div><dt>Potencia<\/dt><dd>{numero(f[\"potencia_mw\"])} MW<\/dd><\/div>\n          <div><dt>Inversión<\/dt><dd>{numero(f[\"inversion_musd\"])} MMUSD<\/dd><\/div>\n          <div><dt>Por MW<\/dt><dd{' class=\"ambar\"' if fuera else \"\"}>{numero(intensidad, 2)}<\/dd><\/div>\n          <div><dt>Baterías<\/dt><dd>Sí<\/dd><\/div>\n        <\/dl>\n        <p class=\"falta\"><span>Falta confirmar en el expediente del SEA:<\/span> MWh de baterías, punto de conexión, fecha de operación y si ya tiene contrato de venta.<\/p>\n        <p class=\"fuente\">Fuente: <a href=\"{escape(url.get(f[\"edicion\"], \"#\"))}\">CNE, Reporte Mensual ERNC, {edicion_larga(f[\"edicion\"])}<\/a>, página {f[\"pagina\"]}<\/p>\n      <\/article>\"\"\")\n    return f\"\"\"\n    <section>\n      <h2>Fichas de oportunidad<\/h2>\n      <p class=\"criterio\">Proyectos con RCA aprobada, con baterías y entre {FICHA_MW_MIN} y {FICHA_MW_MAX} MW, de mayor a menor potencia. Son posibles vendedores de energía para una comercializadora sin centrales propias; el criterio es un supuesto para conversar con el área de Mercados.<\/p>\n      <div class=\"fichas\">{\"\".join(piezas)}<\/div>\n    <\/section>\"\"\"\n\n\ndef bloque_proyectos(filas):\n    cuerpo = \"\".join(f\"\"\"\n        <tr>\n          <td><span class=\"etapa e-{f[\"etapa\"]}\">{\"Aprobado\" if f[\"etapa\"] == \"aprobacion\" else \"Ingresa\"}<\/span><\/td>\n          <td class=\"n\">{fecha_corta(f[\"fecha\"])}<\/td>\n          <td>{escape(f[\"nombre\"])}<\/td>\n          <td class=\"tenue\">{escape(f[\"titular\"])}<\/td>\n          <td>{region(f[\"region\"])}<\/td>\n          <td class=\"sin-corte\">{punto(tecnologia(f[\"tecnologia\"]))}{TECNOLOGIAS[tecnologia(f[\"tecnologia\"])]}<\/td>\n          <td class=\"n\">{numero(f[\"potencia_mw\"])}<\/td>\n          <td class=\"n\">{numero(f[\"inversion_musd\"])}<\/td>\n          <td>{\"Sí\" if f[\"almacenamiento\"] else \"—\"}<\/td>\n        <\/tr>\"\"\" for f in filas)\n    return f\"\"\"\n    <section>\n      <h2>Proyectos<\/h2>\n      <div class=\"tabla\"><table>\n        <thead><tr><th>Etapa<\/th><th class=\"n\">Fecha<\/th><th>Proyecto<\/th><th>Titular<\/th><th>Región<\/th><th>Tecnología<\/th><th class=\"n\">MW<\/th><th class=\"n\">MMUSD<\/th><th>Baterías<\/th><\/tr><\/thead>\n        <tbody>{cuerpo}<\/tbody>\n      <\/table><\/div>\n    <\/section>\"\"\"\n\n\nMETODO = \"\"\"\n    <section class=\"metodo\">\n      <h2>Método<\/h2>\n      <ol class=\"pasos\">\n        <li><b>Descarga<\/b><span>Cada mes la CNE publica en PDF el Reporte Mensual ERNC. Se descarga con su huella SHA-256; si una edición no está, se registra.<\/span><\/li>\n        <li><b>Lectura<\/b><span>Las tablas no se extraen limpias: nombres partidos en varias líneas y formatos que cambian entre meses. Un modelo de lenguaje (Claude) las lee y devuelve filas con un esquema fijo.<\/span><\/li>\n        <li><b>Verificación<\/b><span>Siete reglas revisan lo extraído antes de guardarlo. Si las sumas no cuadran con lo que declara el reporte, el modelo reintenta una vez; si sigue fallando, queda para revisión manual.<\/span><\/li>\n        <li><b>Publicación<\/b><span>Base SQLite y esta página, regenerada con un comando.<\/span><\/li>\n      <\/ol>\n      <dl class=\"reglas\">\n        <div><dt>Totales<\/dt><dd>La suma de MW e inversión coincide con lo que declara el texto del reporte.<\/dd><\/div>\n        <div><dt>Conteo<\/dt><dd>El número de filas coincide con los proyectos declarados.<\/dd><\/div>\n        <div><dt>Evidencia<\/dt><dd>Cada valor extraído aparece en el texto de la página.<\/dd><\/div>\n        <div><dt>Fecha<\/dt><dd>La fecha cae en el mes que cubre la edición.<\/dd><\/div>\n        <div><dt>Rango<\/dt><dd>La inversión por MW está entre 0,3 y 3 MMUSD.<\/dd><\/div>\n        <div><dt>Faltante<\/dt><dd>Un dato que la fuente trae como «-» queda vacío, no en cero.<\/dd><\/div>\n        <div><dt>Duplicado<\/dt><dd>Un proyecto no se repite en la misma etapa, ni en la misma edición ni en otra.<\/dd><\/div>\n      <\/dl>\n    <\/section>\"\"\"\n\nESTILOS = \"\"\"\n:root {\n  --fondo: #fbfaf6; --banda: #eef3ef; --linea-banda: #d6e2da;\n  --tinta: #1d2a26; --tinta-2: #4c5a55; --tenue: #7b8782; --regla: #e3e2da;\n  --solar: #e9a21b; --eolica: #1f8a9b; --mixto: #7c5cb3; --otra: #8a9a3f;\n  --ingreso: #3c78c3; --aprobacion: #2e8b57;\n  --verde: #2e8b57; --rojo: #c8442f; --ambar: #b7791f;\n}\n@media (prefers-color-scheme: dark) { :root {\n  --fondo: #121816; --banda: #18221f; --linea-banda: #26332e;\n  --tinta: #e9eeeb; --tinta-2: #b4c0bb; --tenue: #84918c; --regla: #26302c;\n  --solar: #f2b33d; --eolica: #3fb0c1; --mixto: #a487d6; --otra: #a9bb5c;\n  --ingreso: #6aa1e3; --aprobacion: #4fb57a; --verde: #4fb57a; --rojo: #ee6b55; --ambar: #e3a54a; } }\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody { margin:0; background:var(--fondo); color:var(--tinta); font:15px/1.55 'Archivo', system-ui, sans-serif;\n       font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }\n.contenido { max-width: 1180px; margin: 0 auto; padding: 0 40px; }\nh1, h2, h3, p, dl, dd, ol, ul, figure { margin: 0; }\nsmall { font-size: .55em; font-weight: 500; color: var(--tinta-2); }\n\n/* Cabecera en una banda de color suave, con una franja de las tres tecnologías */\n.cabecera { background: var(--banda); border-bottom: 1px solid var(--linea-banda); position: relative; }\n.cabecera::before { content: \"\"; position: absolute; inset: 0 0 auto 0; height: 4px;\n  background: linear-gradient(90deg, var(--solar) 0 34%, var(--eolica) 34% 67%, var(--aprobacion) 67%); }\n.cabecera .contenido { padding-top: 56px; padding-bottom: 36px; }\n.sobretitulo { font-size: 13px; font-weight: 600; color: var(--eolica); letter-spacing: .02em; }\nh1 { margin-top: 6px; font-size: 60px; line-height: .95; font-stretch: 70%; font-weight: 750; }\nh1 span { color: var(--eolica); }\n.bajada { margin-top: 14px; color: var(--tinta-2); max-width: 64ch; font-size: 17px; }\n.aviso-previa { margin-top: 16px; display: inline-block; padding: 6px 12px; border-left: 3px solid var(--ambar);\n  background: color-mix(in srgb, var(--ambar) 10%, transparent); color: var(--tinta-2); font-size: 14px; max-width: 80ch; }\n.cifras { display: flex; flex-wrap: wrap; margin-top: 34px; gap: 0; }\n.cifras div { padding: 0 34px 0 0; margin-right: 34px; border-right: 1px solid var(--linea-banda); }\n.cifras div:last-child { border: 0; }\n.cifras dt { font-size: 13px; color: var(--tinta-2); }\n.cifras dd { font-size: 34px; font-weight: 650; font-stretch: 85%; line-height: 1.15; }\n.cifras dd.nota { font-size: 13px; font-weight: 400; font-stretch: 100%; color: var(--tenue); }\n\nsection { margin-top: 64px; }\nh2 { font-size: 18px; font-stretch: 82%; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }\nh2::before { content: \"\"; width: 14px; height: 3px; background: var(--eolica); border-radius: 2px; }\n\n/* Gráficos */\n.graf
