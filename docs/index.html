icos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px 64px; }\n.grafico figcaption { font-weight: 650; font-stretch: 85%; font-size: 15px; margin-bottom: 14px; }\n.grafico figcaption span { font-weight: 400; color: var(--tenue); font-size: 13px; margin-left: 4px; }\n.region { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 3.5rem; align-items: center; gap: 12px; padding: 4px 0; font-size: 14px; }\n.region .nombre { color: var(--tinta-2); }\n.region .valor { text-align: right; font-weight: 600; }\n.pista { display: flex; height: 14px; border-radius: 3px; overflow: hidden; transform-origin: left;\n  animation: crecer-x .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 60ms + 150ms); }\n.pista span { display: block; height: 100%; }\n.meses { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; align-items: end; }\n.mes .area { height: 170px; display: flex; align-items: flex-end; justify-content: center; gap: 3px;\n  border-bottom: 1px solid var(--tinta-2); position: relative; }\n.barra { width: 42%; max-width: 14px; border-radius: 2px 2px 0 0; transform-origin: bottom;\n  animation: crecer-y .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 50ms + 200ms); }\n.mes.pendiente .area, .mes.falta .area { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--regla) 5px 6px); }\n.mes.falta .area { background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--rojo) 35%, transparent) 5px 6px); }\n.mes.falta .etiqueta, .mes.falta .etiqueta span { color: var(--rojo); font-weight: 600; }\n.etiqueta { text-align: center; font-size: 12px; color: var(--tinta-2); margin-top: 6px; line-height: 1.2; }\n.etiqueta span { color: var(--tenue); font-size: 11px; }\n.leyenda { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 16px; font-size: 13px; color: var(--tinta-2); }\n.leyenda span { display: inline-flex; align-items: center; gap: 7px; }\n.cuadro { display: inline-block; width: 11px; height: 11px; border-radius: 2px; }\n.cuadro.rayado { background: repeating-linear-gradient(135deg, transparent 0 2px, var(--tenue) 2px 3px); }\n.t-solar { background: var(--solar); } .t-eolica { background: var(--eolica); }\n.t-mixto { background: var(--mixto); } .t-otra { background: var(--otra); }\n.e-ingreso { background: var(--ingreso); } .e-aprobacion { background: var(--aprobacion); }\n.punto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: .02em; }\n\n/* Tablas */\n.tabla { position: relative; overflow-x: auto; margin: 0 -10px; } /* contiene a los .sr absolutos */\ntable { width: 100%; border-collapse: collapse; font-size: 14px; }\nth { text-align: left; font-size: 12.5px; font-weight: 600; font-stretch: 87%; color: var(--tinta-2);\n     padding: 0 10px 8px; border-bottom: 1.5px solid var(--tinta-2); white-space: nowrap; }\ntd { padding: 9px 10px; border-bottom: 1px solid var(--regla); vertical-align: baseline; }\ntbody tr { transition: background .15s; }\ntbody tr:hover { background: color-mix(in srgb, var(--eolica) 6%, transparent); }\n.n { text-align: right; white-space: nowrap; }\n.c { text-align: center; }\n.sin-corte { white-space: nowrap; }\n.verificacion th:nth-child(n+3) { text-align: center; }\n.verificacion .ed { white-space: nowrap; font-weight: 500; }\n.verificacion tr.pendiente td, .verificacion tr.falta td { color: var(--tenue); font-size: 13.5px; }\n.verificacion tr.falta { background: color-mix(in srgb, var(--rojo) 5%, transparent); }\n.etiqueta-estado { font-size: 13px; font-weight: 600; color: var(--tenue); }\n.etiqueta-estado.rojo { color: var(--rojo); } .etiqueta-estado.verde { color: var(--verde); }\n.tenue { color: var(--tenue); } .rojo { color: var(--rojo); } .ambar { color: var(--ambar); } .verde { color: var(--verde); }\n.m { display: inline-block; vertical-align: 0; }\n.m-ok { width: 8px; height: 8px; border-radius: 50%; background: color-mix(in srgb, var(--verde) 70%, transparent); }\n.m-aviso { width: 9px; height: 9px; background: var(--ambar); transform: rotate(45deg) scale(.86); }\n.m-error { width: 9px; height: 9px; background: var(--rojo); }\n.detalles { list-style: none; padding: 0; margin-top: 18px; font-size: 14px; color: var(--tinta-2); }\n.detalles li { padding: 7px 0; border-bottom: 1px solid var(--regla); }\n.detalles .m { margin-right: 10px; }\n.detalles b { color: var(--tinta); font-weight: 600; }\n.etapa { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }\n.etapa::before { content: \"\"; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }\n.etapa.e-ingreso, .etapa.e-aprobacion { background: none; }\n.etapa.e-ingreso { color: var(--ingreso); } .etapa.e-aprobacion { color: var(--aprobacion); }\n\n/* Fichas: sin cajas; una línea de color por tecnología marca cada una */\n.criterio { color: var(--tinta-2); max-width: 80ch; margin-bottom: 14px; }\n.fichas { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px 48px; }\n.ficha { padding: 16px 0 22px; border-top: 3px solid var(--tenue); }\n.ficha.f-solar { border-top-color: var(--solar); } .ficha.f-eolica { border-top-color: var(--eolica); }\n.ficha.f-mixto { border-top-color: var(--mixto); }\n.ficha .meta { font-size: 13px; color: var(--tinta-2); }\n.ficha h3 { margin-top: 6px; font-size: 22px; font-stretch: 78%; line-height: 1.15; }\n.ficha .titular { color: var(--tinta-2); }\n.datos { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 0 26px; margin-top: 12px; }\n.datos dt { font-size: 12.5px; color: var(--tenue); white-space: nowrap; }\n.datos dd { font-size: 18px; font-weight: 650; white-space: nowrap; }\n.falta { margin-top: 12px; font-size: 13.5px; color: var(--tinta-2); }\n.falta span { color: var(--tinta); }\n.fuente { margin-top: 6px; font-size: 13px; color: var(--tenue); }\na { color: var(--eolica); text-underline-offset: 3px; }\n\n/* Método */\n.pasos { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; counter-reset: paso; }\n.pasos li { counter-increment: paso; border-top: 1.5px solid var(--regla); padding-top: 10px; color: var(--tinta-2); font-size: 14px; }\n.pasos b { display: block; color: var(--tinta); font-size: 15px; margin-bottom: 4px; }\n.pasos b::before { content: counter(paso) \" \"; color: var(--eolica); font-weight: 700; }\n.reglas { margin-top: 28px; max-width: 86ch; }\n.reglas div { display: grid; grid-template-columns: 8rem 1fr; padding: 7px 0; border-bottom: 1px solid var(--regla); font-size: 14px; }\n.reglas dt { font-weight: 600; }\n.reglas dd { color: var(--tinta-2); }\nfooter { margin: 72px 0 0; padding: 18px 0 40px; border-top: 1px solid var(--regla); font-size: 13px; color: var(--tenue); }\n.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }\n\n/* Animaciones: crecen las barras al cargar. Las secciones no se ocultan esperando el scroll:\n   con ese efecto, la tabla de proyectos (más alta que la pantalla) quedaba invisible. */\n@keyframes crecer-x { from { transform: scaleX(0); } }\n@keyframes crecer-y { from { transform: scaleY(0); } }\n@media (prefers-reduced-motion: reduce) {\n  *, *::before { animation: none !important; transition: none !important; }\n}\n@media (max-width: 860px) { .graficos { grid-template-columns: 1fr; } .pasos { grid-template-columns: 1fr 1fr; } }\n@media (max-width: 600px) { .contenido { padding: 0 16px; } h1 { font-size: 42px; }\n  .cabecera .contenido { padding-top: 40px; }\n  .cifras div { padding-right: 18px; margin-right: 18px; margin-bottom: 12px; } .cifras dd { font-size: 26px; }\n  .region { grid-template-columns: 7rem minmax(0, 1fr) 3rem; }\n  .meses { gap: 3px; } .mes .area { height: 130px; }\n  .datos { grid-template-columns: repeat(2, auto); } .pasos { grid-template-columns: 1fr; }\n  .reglas div { grid-template-columns: 1fr; } }\n\"\"\"\n\n# Cifras que cuentan desde cero. Sin JS, todo se ve igual.\nSCRIPT = \"\"\"\ndocument.documentElement.classList.add('js');\nconst quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst formato = (v, d) => v.toLocaleString('es-CL', { minimumFractionDigits: d, maximumFractionDigits: d });\nfor (const el of document.querySelectorAll('[data-cuenta]')) {\n  const fin = Number(el.dataset.cuenta), d = Number(el.dataset.decimales || 0);\n  if (quieto || !fin) continue;\n  const t0 = performance.now();\n  const paso = (t) => {\n    const p = Math.min(1, Math.max(0, (t - t0) / 1100)), suave = 1 - Math.pow(1 - p, 3);\n    el.textContent = formato(fin * suave, d);\n    if (p < 1) requestAnimationFrame(paso);\n  };\n  requestAnimationFrame(paso);\n}\n\"\"\"\n\n\ndef pagina(reportes, filas, controles, aviso=None):\n    aviso_html = f'<p class=\"aviso-previa\">{escape(aviso)}<\/p>' if aviso else \"\"\n    return f\"\"\"<!doctype html>\n<html lang=\"es-CL\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Vigía ERNC<\/title>\n<meta name=\"description\" content=\"Proyectos ERNC que entran a evaluación ambiental y se aprueban en Chile, leídos de los reportes de la CNE por un agente y verificados antes de guardarse.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap\" rel=\"stylesheet\">\n<style>{ESTILOS}<\/style>\n<script>document.documentElement.classList.add('js');<\/script>\n<\/head>\n<body>\n<header class=\"cabecera\">\n  <div class=\"contenido\">\n    <p class=\"sobretitulo\">Mercado eléctrico chileno · energías renovables<\/p>\n    <h1>Vigía <span>ERNC<\/span><\/h1>\n    <p class=\"bajada\">Proyectos que entran a evaluación ambiental y se aprueban en Chile. Un agente los lee de los reportes mensuales de la CNE y los verifica antes de guardarlos.<\/p>\n    {aviso_html}\n    {bloque_cifras(reportes, filas, controles)}\n  <\/div>\n<\/header>\n<main class=\"contenido\">\n  {bloque_graficos(reportes, filas)}\n  {bloque_verificacion(reportes, controles)}\n  {bloque_fichas(fichas(filas), reportes)}\n  {bloque_proyectos(filas)}\n  {METODO}\n  <footer>Prototipo de Francisco Ruiz · Datos públicos de la Comisión Nacional de Energía · Generado el {fecha_corta(date.today().isoformat())}<\/footer>\n<\/main>\n<script>{SCRIPT}<\/script>\n<\/body>\n<\/html>\n\"\"\"\n\n\ndef publicar(con, ruta=Path(\"docs/informe.html\"), aviso=None):\n    reportes, filas, controles = leer_base(con)\n    ruta = Path(ruta)\n    ruta.parent.mkdir(parents=True, exist_ok=True)\n    ruta.write_text(pagina(reportes, filas, controles, aviso), encoding=\"utf-8\")\n    return ruta\n\n\ndef vista_previa(ruta=Path(\"salida/vista-previa.html\")):\n    \"\"\"Misma página, pero con las ediciones transcritas a mano en lugar de la salida del modelo.\"\"\"\n    con = base.conectar(\":memory:\")\n    reales = base.conectar()\n    base.guardar_reportes(con, [dict(r) for r in reales.execute(\"SELECT * FROM reportes\")])\n    for ref in sorted(Path(\"tests/datos\").glob(\"esperado_*.json\")):\n        extraccion = json.loads(ref.read_text(encoding=\"utf-8\"))\n        edicion = extraccion[\"edicion\"]\n        paginas = leer.leer_tablas(descargar.CARPETA / f\"{edicion}.pdf\")\n        textos = {etapa: p[\"texto\"] for etapa, p in paginas.items()}\n        controles = validar.validar_edicion(edicion, extraccion, textos, base.filas_previas(con, edicion))\n        base.guardar_edicion(con, edicion, paginas, extraccion[\"filas\"], controles)\n    aviso = (\"Vista previa: solo dos ediciones (octubre 2025 y septiembre 2026), transcritas a mano y pasadas \"\n             \"por las mismas siete reglas. El resto espera la lectura del modelo.\")\n    return publicar(con, ruta, aviso)\n", "bytes": 29879}, {"ruta": "vigia/validar.py", "contenido": "\"\"\"Las siete reglas que verifican lo que extrajo el modelo.\n\nEl modelo propone, las reglas verifican. Cada regla es una función pura que\nrecibe filas (diccionarios) y devuelve un control:\n    {\"regla\": ..., \"resultado\": \"ok\" | \"aviso\" | \"error\", \"detalle\": ...}\n\"\"\"\nimport re\nimport unicodedata\n\n\ndef control(regla, resultado, detalle):\n    return {\"regla\": regla, \"resultado\": resultado, \"detalle\": detalle}\n\n\ndef normalizar(texto):\n    \"\"\"Texto comparable: sin tildes, en minúsculas y sin espacios, guiones, barras ni puntos.\n\n    Así «CANDE-\\\\nLARIA», «Solar -  PV» y «30-09- 2025» calzan con «Candelaria»,\n    «Solar - PV» y «30092025», aunque el PDF los haya partido en varias líneas.\n    \"\"\"\n    texto = unicodedata.normalize(\"NFKD\", texto)\n    texto = \"\".join(c for c in texto if not unicodedata.combining(c))  # quita tildes\n    return re.sub(r\"[\\s\\-‐–—/.­]\", \"\", texto.lower())\n\n\ndef numeros_en(texto):\n    \"\"\"Conjunto de números escritos en el texto, sin punto de miles («1.248» -> «1248»).\"\"\"\n    return {n.replace(\".\", \"\") for n in re.findall(r\"\\d+(?:\\.\\d{3})*(?:,\\d+)?\", texto)}\n\n\ndef como_texto(numero):\n    \"\"\"120.0 -> '120'; 9.5 -> '9,5' (así se escribe en el reporte).\"\"\"\n    return str(int(numero)) if numero == int(numero) else str(numero).replace(\".\", \",\")\n\n\ndef mes_cubierto(edicion):\n    \"\"\"La edición AAAAMM informa el mes anterior: '202609' -> '2026-08'.\"\"\"\n    a, m = int(edicion[:4]), int(edicion[4:])\n    a, m = (a - 1, 12) if m == 1 else (a, m - 1)\n    return f\"{a}-{m:02d}\"\n\n\ndef clave(fila):\n    \"\"\"Identidad de un proyecto: nombre y titular normalizados.\"\"\"\n    return normalizar(fila[\"nombre\"]) + \"|\" + normalizar(fila[\"titular\"])\n\n\n# --- 1. Totales -----------------------------------------------------------------\ndef totales(filas, declarado, tolerancia=1):\n    \"\"\"La suma de MW y MMUSD de las filas coincide con lo que declara el texto.\n\n    La tolerancia de 1 cubre el redondeo de las cifras publicadas.\n    \"\"\"\n    mw = sum(f[\"potencia_mw\"] or 0 for f in filas)  # potencia «-» cuenta como 0 en la suma\n    mmusd = sum(f[\"inversion_musd\"] or 0 for f in filas)\n    dif = []\n    if abs(mw - declarado[\"mw\"]) > tolerancia:\n        dif.append(f\"las filas suman {como_texto(mw)} MW y el reporte declara {como_texto(declarado['mw'])}\")\n    if abs(mmusd - declarado[\"mmusd\"]) > tolerancia:\n        dif.append(f\"las filas suman {como_texto(mmusd)} MMUSD y el reporte declara {como_texto(declarado['mmusd'])}\")\n    if dif:\n        return control(\"totales\", \"error\", \"; \".join(dif))\n    return control(\"totales\", \"ok\", f\"{como_texto(mw)} MW y {como_texto(mmusd)} MMUSD, igual a lo declarado\")\n\n\n# --- 2. Conteo ------------------------------------------------------------------\ndef conteo(filas, declarado):\n    if len(filas) != declarado[\"proyectos\"]:\n        return control(\"conteo\", \"error\",\n                       f\"hay {len(filas)} filas y el reporte declara {declarado['proyectos']} proyectos\")\n    return control(\"conteo\", \"ok\", f\"{len(filas)} filas, igual a lo declarado\")\n\n\n# --- 3. Evidencia ---------------------------------------------------------------\ndef evidencia(filas, declarado, texto):\n    \"\"\"Cada valor extraído tiene que estar escrito en la página (si no, el modelo lo inventó).\"\"\"\n    plano = normalizar(texto)\n    numeros = numeros_en(texto)\n    faltan = []\n    for f in filas:\n        a, m, d = f[\"fecha\"].split(\"-\")\n        textos = {\"tecnología\": f[\"tecnologia\"], \"región\": f[\"region\"], \"titular\": f[\"titular\"],\n                  \"nombre\": f[\"nombre\"], \"fecha\": d + m + a}  # «19/08/2026» y «19-08- 2026» quedan «19082026»\n        for campo, valor in textos.items():\n            if normalizar(valor) not in plano:\n                faltan.append(f\"{f['nombre']}: {campo} «{valor}»\")\n        for campo in (\"potencia_mw\", \"inversion_musd\"):\n            if f[campo] is not None and como_texto(f[campo]) not in numeros:\n                faltan.append(f\"{f['nombre']}: {campo} {como_texto(f[campo])}\")\n    # los totales declarados: la cita está en la página y contiene los tres números\n    if normalizar(declarado[\"cita\"]) not in plano:\n        faltan.append(\"la cita de los totales no está en la página\")\n    en_cita = numeros_en(declarado[\"cita\"])\n    for campo in (\"proyectos\", \"mw\", \"mmusd\"):\n        if como_texto(declarado[campo]) not in en_cita:\n            faltan.append(f\"total {campo} {como_texto(declarado[campo])} no está en la cita\")\n    if faltan:\n        return control(\"evidencia\", \"error\", \"no aparece en el texto: \" + \"; \".join(faltan))\n    return control(\"evidencia\", \"ok\", \"todos los valores aparecen en la página\")\n\n\n# --- 4. Fecha en el mes ---------------------------------------------------------\ndef fecha_en_mes(filas, edicion):\n    \"\"\"La fecha cae en el mes que cubre el reporte (la edición de septiembre informa agosto).\"\"\"\n    mes = mes_cubierto(edicion)\n    fuera = [f\"{f['nombre']} ({f['fecha']})\" for f in filas if not f[\"fecha\"].startswith(mes)]\n    if fuera:\n        return control(\"fecha_en_mes\", \"error\", f\"fuera de {mes}: \" + \"; \".join(fuera))\n    return control(\"fecha_en_mes\", \"ok\", f\"todas las fechas caen en {mes}\")\n\n\n# --- 5. Unidades y rango --------------------------------------------------------\ndef rango(filas, minimo=0.3, maximo=3.0):\n    \"\"\"MW mayor que cero e inversión por MW entre 0,3 y 3 MMUSD. Es aviso: puede ser legítimo.\"\"\"\n    raros = []\n    for f in filas:\n        mw = f[\"potencia_mw\"]\n        if mw is None or f[\"inversion_musd\"] is None:\n            continue  # de eso se encarga la regla «faltante»\n        if mw <= 0:\n            raros.append(f\"{f['nombre']}: potencia {como_texto(mw)} MW\")\n        elif not minimo <= f[\"inversion_musd\"] / mw <= maximo:\n            raros.append(f\"{f['nombre']}: {f['inversion_musd'] / mw:.2f} MMUSD/MW\".replace(\".\", \",\"))\n    if raros:\n        return control(\"rango\", \"aviso\", \"revisar: \" + \"; \".join(raros))\n    return control(\"rango\", \"ok\", \"MW > 0 e inversión por MW entre 0,3 y 3 MMUSD\")\n\n\n# --- 6. Faltante ----------------------------------------------------------------\ndef faltante(filas):\n    \"\"\"Potencia o inversión «-» en la fuente: queda vacía (None), nunca en cero.\"\"\"\n    sin_dato = [f\"{f['nombre']} ({campo})\" for f in filas\n                for campo, clave in ((\"potencia\", \"potencia_mw\"), (\"inversión\", \"inversion_musd\"))\n                if f[clave] is None]\n    if sin_dato:\n        return control(\"faltante\", \"aviso\", \"«-» en la fuente: \" + \"; \".join(sin_dato))\n    return control(\"faltante\", \"ok\", \"todas las filas traen potencia e inversión\")\n\n\n# --- 7. Duplicado ---------------------------------------------------------------\ndef duplicado(filas, anteriores=()):\n    \"\"\"Mismo proyecto (nombre y titular normalizados) repetido en la misma etapa.\n\n    Revisa dentro de la edición y contra `anteriores`: filas de ediciones previas\n    de la misma etapa, cada una con su campo \"edicion\".\n    \"\"\"\n    vistos = {clave(f): f[\"edicion\"] for f in anteriores}\n    repetidos = []\n    for f in filas:\n        k = clave(f)\n        if k in vistos:\n            repetidos.append(f\"{f['nombre']} (ya en {vistos[k]})\")\n        vistos[k] = \"esta edición\"\n    if repetidos:\n        return control(\"duplicado\", \"aviso\", \"repetido: \" + \"; \".join(repetidos))\n    return control(\"duplicado\", \"ok\", \"sin repetidos\")\n\n\nREGLAS = [\"totales\", \"conteo\", \"evidencia\", \"fecha_en_mes\", \"rango\", \"faltante\", \"duplicado\"]\n\n\ndef validar_edicion(edicion, extraccion, textos, anteriores=()):\n    \"\"\"Aplica las siete reglas a las dos tablas de una edición.\n\n    extraccion: el último intento guardado por extraer.py\n    textos:     {etapa: texto de la página}\n    anteriores: filas de ediciones previas, con su \"edicion\" (para la regla de duplicado)\n    \"\"\"\n    controles = []\n    for etapa in (\"ingreso\", \"aprobacion\"):\n        filas = [f for f in extraccion[\"filas\"] if f[\"etapa\"] == etapa]\n        declarado = extraccion[f\"declarado_{etapa}\"]\n        previas = [f for f in anteriores if f[\"etapa\"] == etapa]\n        for c in (totales(filas, declarado),\n                  conteo(filas, declarado),\n                  evidencia(filas, declarado, textos[etapa]),\n                  fecha_en_mes(filas, edicion),\n                  rango(filas),\n                  faltante(filas),\n                  duplicado(filas, previas)):\n            controles.append({\"edicion\": edicion, \"etapa\": etapa, **c})\n    return controles\n", "bytes": 8599}, {"ruta": "tests/conftest.py", "contenido": "\"\"\"Datos compartidos por las pruebas: textos de página y referencias transcritas a mano.\"\"\"\nimport json\nfrom pathlib import Path\n\nimport pytest\n\nDATOS = Path(__file__).parent / \"datos\"\n\n\ndef cargar_referencia(edicion):\n    return json.loads((DATOS / f\"esperado_{edicion}.json\").read_text(encoding=\"utf-8\"))\n\n\ndef cargar_textos(edicion):\n    return {etapa: (DATOS / f\"texto_{edicion}_{etapa}.txt\").read_text(encoding=\"utf-8\")\n            for etapa in (\"ingreso\", \"aprobacion\")}\n\n\n@pytest.fixture\ndef ref_202609():\n    return cargar_referencia(\"202609\")\n\n\n@pytest.fixture\ndef textos_202609():\n    return cargar_textos(\"202609\")\n", "bytes": 627}, {"ruta": "tests/test_descargar_leer_base.py", "contenido": "\"\"\"Pruebas de descarga (sin red), lectura de páginas y base SQLite.\"\"\"\nimport io\nimport urllib.error\nfrom pathlib import Path\n\nimport pytest\n\nfrom conftest import cargar_referencia, cargar_textos\nfrom vigia import base, descargar, leer, validar\n\n\n# --- Descarga -----------------------------------------------------------------------\n\ndef test_ediciones_y_url():\n    lista = descargar.ediciones()\n    assert lista[0] == \"202510\" and lista[-1] == \"202609\" and len(lista) == 12\n    assert descargar.url_de(\"202609\") == \\\n        \"https://www.cne.cl/wp-content/uploads/2026/09/RMensual_ERNC_v202609.pdf\"\n\n\ndef test_es_pdf():\n    assert descargar.es_pdf(b\"%PDF-1.7 ...\")\n    assert not descargar.es_pdf(b\"<!DOCTYPE html><html>No encontrado\")\n\n\ndef test_mayo_2026_queda_faltante_sin_detener_el_resto(tmp_path, monkeypatch):\n    \"\"\"Simula la CNE: mayo responde 404, abril una página HTML y junio un PDF.\"\"\"\n    def urlopen_simulado(pedido, timeout):\n        url = pedido.full_url\n        if \"202605\" in url:\n            raise urllib.error.HTTPError(url, 404, \"Not Found\", None, None)\n        if \"202604\" in url:\n            return io.BytesIO(b\"<html>error<\/html>\")\n        return io.BytesIO(b\"%PDF-1.7 contenido\")\n\n    monkeypatch.setattr(descargar.urllib.request, \"urlopen\", urlopen_simulado)\n    registros = [descargar.descargar_edicion(e, tmp_path) for e in (\"202604\", \"202605\", \"202606\")]\n\n    assert [r[\"estado\"] for r in registros] == [\"faltante\", \"faltante\", \"ok\"]\n    assert registros[2][\"sha256\"] and len(registros[2][\"sha256\"]) == 64\n    assert sorted(p.name for p in tmp_path.iterdir()) == [\"202606.pdf\"]\n\n\n# --- Lectura ------------------------------------------------------------------------\n\ndef test_etapa_de_pagina():\n    textos = cargar_textos(\"202609\")\n    assert leer.etapa_de_pagina(textos[\"ingreso\"]) == \"ingreso\"\n    assert leer.etapa_de_pagina(textos[\"aprobacion\"]) == \"aprobacion\"\n    # el índice nombra las secciones pero no trae la tabla\n    assert leer.etapa_de_pagina(\"1. Proyectos Ingresados a Evaluación Ambiental\\n3. Proyectos con RCA Aprobada\") is None\n\n\nPDF = Path(\"datos/reportes\")\n\n\n@pytest.mark.skipif(not (PDF / \"202609.pdf\").exists(), reason=\"PDF no descargado\")\ndef test_paginas_cambian_entre_ediciones():\n    assert {k: v[\"pagina\"] for k, v in leer.leer_tablas(PDF / \"202609.pdf\").items()} == \\\n        {\"ingreso\": 6, \"aprobacion\": 7}\n    if (PDF / \"202510.pdf\").exists():\n        assert {k: v[\"pagina\"] for k, v in leer.leer_tablas(PDF / \"202510.pdf\").items()} == \\\n            {\"ingreso\": 7, \"aprobacion\": 8}\n\n\n# --- Base ---------------------------------------------------------------------------\n\ndef test_base_guarda_y_agrupa_proyectos():\n    con = base.conectar(\":memory:\")\n    base.guardar_reportes(con, [\n        {\"edicion\": \"202609\", \"url\": \"u\", \"sha256\": \"x\", \"descargado\": \"hoy\", \"estado\": \"ok\"},\n        {\"edicion\": \"202605\", \"url\": \"u\", \"sha256\": None, \"descargado\": None, \"estado\": \"faltante\"}])\n    ref, textos = cargar_referencia(\"202609\"), cargar_textos(\"202609\")\n    paginas = {\"ingreso\": {\"pagina\": 6, \"texto\": textos[\"ingreso\"]},\n               \"aprobacion\": {\"pagina\": 7, \"texto\": textos[\"aprobacion\"]}}\n    controles = validar.validar_edicion(\"202609\", ref, textos)\n    base.guardar_edicion(con, \"202609\", paginas, ref[\"filas\"], controles)\n    base.guardar_edicion(con, \"202609\", paginas, ref[\"filas\"], controles)  # repetir no duplica\n\n    assert con.execute(\"SELECT COUNT(*) FROM filas\").fetchone()[0] == 12\n    assert con.execute(\"SELECT COUNT(*) FROM controles\").fetchone()[0] == 14\n    assert con.execute(\"SELECT estado FROM reportes WHERE edicion = '202605'\").fetchone()[0] == \"faltante\"\n    el_faro = con.execute(\"SELECT potencia_mw, pagina FROM filas WHERE nombre LIKE '%El Faro%'\").fetchone()\n    assert el_faro[\"potencia_mw\"] is None and el_faro[\"pagina\"] == 6\n    # CIUDADLUZ tiene dos proyectos distintos: la vista no los mezcla\n    assert con.execute(\"SELECT COUNT(*) FROM proyectos WHERE titular = 'CIUDADLUZ'\").fetchone()[0] == 2\n    assert len(base.filas_previas(con, \"202610\")) == 12\n", "bytes": 4061}, {"ruta": "tests/test_extraer.py", "contenido": "\"\"\"Pruebas de la extracción con un cliente simulado: sin red y sin clave.\"\"\"\nimport copy\nimport json\nfrom types import SimpleNamespace\n\nimport pytest\n\nfrom conftest import cargar_referencia, cargar_textos\nfrom vigia import extraer\nfrom vigia.extraer import Extraccion\n\n\nclass ClienteSimulado:\n    \"\"\"Imita a anthropic.Anthropic(): entrega respuestas preparadas y anota cada llamada.\"\"\"\n\n    def __init__(self, *respuestas):\n        self.respuestas = list(respuestas)\n        self.llamadas = []\n        self.messages = self  # cliente.messages.parse(...)\n\n    def parse(self, **kwargs):\n        self.llamadas.append(kwargs)\n        return self.respuestas.pop(0)\n\n\ndef respuesta(datos, stop_reason=\"end_turn\"):\n    return SimpleNamespace(stop_reason=stop_reason, parsed_output=Extraccion.model_validate(datos))\n\n\n@pytest.fixture\ndef paginas():\n    textos = cargar_textos(\"202609\")\n    return {\"ingreso\": {\"pagina\": 6, \"texto\": textos[\"ingreso\"]},\n            \"aprobacion\": {\"pagina\": 7, \"texto\": textos[\"aprobacion\"]}}\n\n\ndef test_extrae_y_guarda_cache(tmp_path, paginas):\n    ref = cargar_referencia(\"202609\")\n    cliente = ClienteSimulado(respuesta(ref))\n    resultado = extraer.extraer_edicion(\"202609\", paginas, cliente, carpeta=tmp_path)\n\n    assert len(cliente.llamadas) == 1\n    llamada = cliente.llamadas[0]\n    assert llamada[\"model\"] == \"claude-opus-5-5\"\n    assert llamada[\"output_format\"] is Extraccion\n    assert llamada[\"output_config\"] == {\"effort\": \"low\"}\n    assert \"Parque Eólico Viena\" in llamada[\"messages\"][0][\"content\"]  # el texto de la página va en el mensaje\n\n    assert len(resultado[\"intentos\"]) == 1\n    assert resultado[\"intentos\"][0][\"filas\"][0][\"fecha\"] == \"2026-08-19\"\n    assert (tmp_path / \"202609.json\").exists()\n\n    # con la caché no se vuelve a llamar al modelo\n    otro = ClienteSimulado()\n    assert extraer.extraer_edicion(\"202609\", paginas, otro, carpeta=tmp_path) == json.loads(\n        (tmp_path / \"202609.json\").read_text(encoding=\"utf-8\"))\n    assert otro.llamadas == []\n\n\ndef test_reintenta_una_vez_con_la_diferencia(tmp_path, paginas):\n    ref = cargar_referencia(\"202609\")\n    incompleta = copy.deepcopy(ref)\n    # el modelo se salta Las Mellizas (212 MW, 400 MMUSD)\n    incompleta[\"filas\"] = [f for f in ref[\"filas\"] if f[\"nombre\"] != \"Planta Fotovoltaica Las Mellizas\"]\n    cliente = ClienteSimulado(respuesta(incompleta), respuesta(ref))\n\n    resultado = extraer.extraer_edicion(\"202609\", paginas, cliente, carpeta=tmp_path)\n\n    assert len(cliente.llamadas) == 2\n    reclamo = cliente.llamadas[1][\"messages\"][-1][\"content\"]\n    assert \"las filas suman 309 MW y el reporte declara 521\" in reclamo\n    assert \"hay 7 filas y el reporte declara 8\" in reclamo\n    assert len(resultado[\"intentos\"]) == 2\n    assert len(resultado[\"intentos\"][-1][\"filas\"]) == 12\n\n\ndef test_no_reintenta_mas_de_una_vez(tmp_path, paginas):\n    ref = cargar_referencia(\"202609\")\n    mala = copy.deepcopy(ref)\n    mala[\"filas\"] = mala[\"filas\"][:-1]\n    cliente = ClienteSimulado(respuesta(mala), respuesta(mala))\n    resultado = extraer.extraer_edicion(\"202609\", paginas, cliente, carpeta=tmp_path)\n    assert len(cliente.llamadas) == 2  # el error queda para revisión manual\n    assert len(resultado[\"intentos\"]) == 2\n\n\n@pytest.mark.parametrize(\"motivo\", [\"refusal\", \"max_tokens\"])\ndef test_stop_reason_malo_es_error(tmp_path, paginas, motivo):\n    cliente = ClienteSimulado(respuesta(cargar_referencia(\"202609\"), stop_reason=motivo))\n    with pytest.raises(RuntimeError, match=motivo):\n        extraer.extraer_edicion(\"202609\", paginas, cliente, carpeta=tmp_path)\n    assert not (tmp_path / \"202609.json\").exists()  # nada a medias en la caché\n", "bytes": 3674}, {"ruta": "tests/test_validar.py", "contenido": "\"\"\"Pruebas de las siete reglas y prueba de aceptación del plan.\"\"\"\nimport copy\n\nfrom conftest import cargar_referencia, cargar_textos\nfrom vigia import validar\n\n\ndef fila(nombre=\"Parque A\", titular=\"Titular A\", fecha=\"2026-08-10\", mw=100, inv=150, **otros):\n    return {\"etapa\": \"ingreso\", \"tecnologia\": \"Solar - PV\", \"region\": \"V\", \"titular\": titular,\n            \"nombre\": nombre, \"fecha\": fecha, \"potencia_mw\": mw, \"inversion_musd\": inv,\n            \"almacenamiento\": True, **otros}\n\n\ndef declarado(proyectos, mw, mmusd, cita=\"\"):\n    return {\"proyectos\": proyectos, \"mw\": mw, \"mmusd\": mmusd, \"cita\": cita}\n\n\n# --- Prueba de aceptación (tabla del plan) ----------------------------------------\n\ndef de_etapa(ref, etapa):\n    return [f for f in ref[\"filas\"] if f[\"etapa\"] == etapa]\n\n\ndef test_aceptacion_septiembre_2026_ingresos(ref_202609):\n    filas = de_etapa(ref_202609, \"ingreso\")\n    assert len(filas) == 4\n    assert sum(f[\"potencia_mw\"] or 0 for f in filas) == 245\n    assert sum(f[\"inversion_musd\"] for f in filas) == 280\n    el_faro = next(f for f in filas if \"El Faro\" in f[\"nombre\"])\n    assert el_faro[\"potencia_mw\"] is None\n\n\ndef test_aceptacion_septiembre_2026_aprobados(ref_202609):\n    filas = de_etapa(ref_202609, \"aprobacion\")\n    assert len(filas) == 8\n    assert sum(f[\"potencia_mw\"] for f in filas) == 521\n    assert sum(f[\"inversion_musd\"] for f in filas) == 854\n\n\ndef test_aceptacion_septiembre_2026_pasa_las_reglas(ref_202609, textos_202609):\n    controles = validar.validar_edicion(\"202609\", ref_202609, textos_202609)\n    assert len(controles) == 14  # 7 reglas x 2 tablas\n    errores = [c for c in controles if c[\"resultado\"] == \"error\"]\n    assert errores == []\n    avisos = [(c[\"etapa\"], c[\"regla\"]) for c in controles if c[\"resultado\"] == \"aviso\"]\n    assert avisos == [(\"ingreso\", \"faltante\")]  # El Faro sin potencia\n\n\ndef test_aceptacion_octubre_2025_fechas_partidas():\n    \"\"\"En octubre de 2025 las fechas vienen como «30-09- 2025» y deben quedar 2025-09-30.\"\"\"\n    ref, textos = cargar_referencia(\"202510\"), cargar_textos(\"202510\")\n    assert \"30-09- 2025\" in textos[\"ingreso\"]\n    pampino = next(f for f in ref[\"filas\"] if f[\"nombre\"] == \"Parque Fotovoltaico Pampino\")\n    assert pampino[\"fecha\"] == \"2025-09-30\"\n    controles = validar.validar_edicion(\"202510\", ref, textos)\n    assert [c for c in controles if c[\"resultado\"] == \"error\"] == []\n\n\ndef test_octubre_2025_titular_partido_con_guion():\n    \"\"\"«INVERSIONES CANDE-» + «LARIA SOLAR SPA» en el PDF calza con el titular unido.\"\"\"\n    textos = cargar_textos(\"202510\")\n    assert \"CANDE-\\nLARIA\" in textos[\"aprobacion\"]\n    assert validar.normalizar(\"INVERSIONES CANDELARIA SOLAR SPA\") in validar.normalizar(textos[\"aprobacion\"])\n\n\n# --- 1. Totales ---------------------------------------------------------------------\n\ndef test_totales_ok():\n    filas = [fila(mw=100, inv=150), fila(mw=None, inv=10)]\n    assert validar.totales(filas, declarado(2, 100, 160))[\"resultado\"] == \"ok\"\n\n\ndef test_totales_error_da_la_diferencia():\n    c = validar.totales([fila(mw=500, inv=854)], declarado(1, 521, 854))\n    assert c[\"resultado\"] == \"error\"\n    assert \"las filas suman 500 MW y el reporte declara 521\" in c[\"detalle\"]\n\n\n# --- 2. Conteo ----------------------------------------------------------------------\n\ndef test_conteo():\n    assert validar.conteo([fila(), fila()], declarado(2, 0, 0))[\"resultado\"] == \"ok\"\n    c = validar.conteo([fila()], declarado(2, 0, 0))\n    assert c[\"resultado\"] == \"error\" and \"hay 1 filas\" in c[\"detalle\"]\n\n\n# --- 3. Evidencia -------------------------------------------------------------------\n\ndef test_evidencia_detecta_un_valor_inventado(ref_202609, textos_202609):\n    ref = copy.deepcopy(ref_202609)\n    filas = de_etapa(ref, \"aprobacion\")\n    filas[0][\"titular\"] = \"Empresa Inventada SpA\"\n    filas[1][\"inversion_musd\"] = 999\n    c = validar.evidencia(filas, ref[\"declarado_aprobacion\"], textos_202609[\"aprobacion\"])\n    assert c[\"resultado\"] == \"error\"\n    assert \"Empresa Inventada SpA\" in c[\"detalle\"] and \"999\" in c[\"detalle\"]\n\n\ndef test_evidencia_detecta_total_que_no_esta_en_la_cita(ref_202609, textos_202609):\n    dec = dict(ref_202609[\"declarado_aprobacion\"], mw=530)\n    c = validar.evidencia(de_etapa(ref_202609, \"aprobacion\"), dec, textos_202609[\"aprobacion\"])\n    assert c[\"resultado\"] == \"error\" and \"total mw 530\" in c[\"detalle\"]\n\n\ndef test_normalizar_espacios_guiones_y_tildes():\n    assert validar.normalizar(\"Solar -  PV\") == validar.normalizar(\"Solar - PV\") == \"solarpv\"\n    assert validar.normalizar(\"Almacena-\\nmiento\") == \"almacenamiento\"\n    assert validar.normalizar(\"30-09- 2025\") == validar.normalizar(\"30/09/2025\") == \"30092025\"\n    assert validar.normalizar(\"Pillancó\") == \"pillanco\"\n\n\ndef test_numeros_en_quita_punto_de_miles():\n    assert {\"1248\", \"574\", \"8\"} <= validar.numeros_en(\"acogió 8 proyectos, 574 MW y 1.248 MMUSD\")\n\n\n# --- 4. Fecha en el mes -------------------------------------------------------------\n\ndef test_mes_cubierto():\n    assert validar.mes_cubierto(\"202609\") == \"2026-08\"\n    assert validar.mes_cubierto(\"202601\") == \"2025-12\"\n\n\ndef test_fecha_fuera_del_mes():\n    assert validar.fecha_en_mes([fila(fecha=\"2026-08-31\")], \"202609\")[\"resultado\"] == \"ok\"\n    c = validar.fecha_en_mes([fila(fecha=\"2026-04-15\")], \"202609\")\n    assert c[\"resultado\"] == \"error\" and \"2026-04-15\" in c[\"detalle\"]\n\n\n# --- 5. Unidades y rango ------------------------------------------------------------\n\ndef test_rango():\n    assert validar.rango([fila(mw=100, inv=150)])[\"resultado\"] == \"ok\"\n    assert validar.rango([fila(mw=9, inv=43)])[\"resultado\"] == \"aviso\"   # 4,8 MMUSD/MW\n    assert validar.rango([fila(mw=100, inv=10)])[\"resultado\"] == \"aviso\"  # 0,1 MMUSD/MW\n    assert validar.rango([fila(mw=0, inv=10)])[\"resultado\"] == \"aviso\"\n    assert validar.rango([fila(mw=None, inv=10)])[\"resultado\"] == \"ok\"    # lo ve «faltante»\n\n\n# --- 6. Faltante --------------------------------------------------------------------\n\ndef test_faltante():\n    assert validar.faltante([fila(mw=10)])[\"resultado\"] == \"ok\"\n    c = validar.faltante([fila(nombre=\"El Faro\", mw=None)])\n    assert c[\"resultado\"] == \"aviso\" and \"El Faro\" in c[\"detalle\"]\n\n\ndef test_inversion_faltante_no_rompe_las_reglas():\n    # diciembre de 2025 trae una inversión «-»: queda en None, avisa y no cuenta en la suma\n    filas = [fila(nombre=\"SLK\", mw=9, inv=None), fila(mw=10, inv=12)]\n    assert validar.faltante(filas)[\"resultado\"] == \"aviso\"\n    assert \"SLK (inversión)\" in validar.faltante(filas)[\"detalle\"]\n    assert validar.rango(filas)[\"resultado\"] == \"ok\"\n    assert validar.totales(filas, declarado(2, 19, 12))[\"resultado\"] == \"ok\"\n\n\n# --- 7. Duplicado -------------------------------------------------------------------\n\ndef test_duplicado_en_la_misma_edicion():\n    c = validar.duplicado([fila(), fila(nombre=\"PARQUE  a\", titular=\"titular a\")])\n    assert c[\"resultado\"] == \"aviso\"\n\n\ndef test_duplicado_contra_ediciones_previas():\n    previa = fila(nombre=\"Parque Eólico Las Lilas\", titular=\"Parque Eólico Las Lilas SpA\", edicion=\"202606\")\n    actual = fila(nombre=\"Parque Eólico Las Lilas\", titular=\"Parque Eólico Las Lilas SpA\")\n    c = validar.duplicado([actual], [previa])\n    assert c[\"resultado\"] == \"aviso\" and \"ya en 202606\" in c[\"detalle\"]\n    assert validar.duplicado([fila(nombre=\"Otro\")], [previa])[\"resultado\"] == \"ok\"\n\n\n# --- Precisión contra la referencia -------------------------------------------------\n\ndef test_precision_contra_referencia(ref_202609):\n    from vigia.precision import comparar\n    filas = ref_202609[\"filas\"]\n    assert comparar(filas, filas) == (96, 96, [])  # 12 filas x 8 campos\n    con_errores = copy.deepcopy(filas[1:])          # omite Viena y cambia una fecha\n    con_errores[0][\"fecha\"] = \"2026-08-12\"\n    aciertos, total, dif = comparar(con_errores, filas)\n    assert (aciertos, total) == (87, 96)\n    assert any(\"omitió\" in d for d in dif) and any(\"fecha\" in d for d in dif)\n", "bytes": 8155}, {"ruta": "tests/datos/esperado_202510.json", "contenido": "{\n  \"edicion\": \"202510\",\n  \"nota\": \"Transcrito a mano desde el PDF de la CNE (páginas de las tablas).\",\n  \"filas\": [\n    {\n      \"etapa\": \"ingreso\",\n      \"tecnologia\": \"Solar - PV\",\n      \"region\": \"I\",\n      \"titular\": \"Pampino Solar SpA\",\n      \"nombre\": \"Parque Fotovoltaico Pampino\",\n      \"fecha\": \"2025-09-30\",\n      \"potencia_mw\": 170,\n      \"inversion_musd\": 263,\n      \"almacenamiento\": true\n    },\n    {\n      \"etapa\": \"ingreso\",\n      \"tecnologia\": \"Solar - PV\",\n      \"region\": \"X\",\n      \"titular\": \"Energía Renovable Turquesa SpA\",\n      \"nombre\": \"Parque Fotovoltaico Los Maquis\",\n      \"fecha\": \"2025-09-16\",\n      \"potencia_mw\": 9,\n      \"inversion_musd\": 15,\n      \"almacenamiento\": true\n    },\n    {\n      \"etapa\": \"ingreso\",\n      \"tecnologia\": \"Solar - PV\",\n      \"region\": \"VII\",\n      \"titular\": \"Manquel Solar SpA\",\n      \"nombre\": \"Parque Fotovoltaico Manquel Solar\",\n      \"fecha\": \"2025-09-03\",\n      \"potencia_mw\": 65,\n      \"inversion_musd\": 39,\n      \"almacenamiento\": true\n    },\n    {\n      \"etapa\": \"ingreso\",\n      \"tecnologia\": \"Solar - PV\",\n      \"region\": \"RM\",\n      \"titular\": \"CLD GENERACION 2 SPA\",\n      \"nombre\": \"PLANTA FOTOVOLTAICA GRANEROS I // ── Gestor de ventanas ────────────────────────────────────────────────
const APPS = {

function ventana(app) {
  if (ventanas[app]) return ventanas[app];
  const a = APPS[app];
  const v = document.createElement('section');
  v.className = 'ventana';
  v.dataset.app = app;
  v.setAttribute('role', 'dialog');
  v.setAttribute('aria-label', a.nombre);
  v.innerHTML = `
    <header class="titulo">
      <div class="izq">${ICONO[app]}<h2>${a.nombre}</h2></div>
      <div class="controles">

        <button class="max" aria-label="Maximizar">${SVG_MAX}</button>
        <button class="cerrar" aria-label="Cerrar">${SVG_CERRAR}</button>
      </div>
    </header>
    <div class="cuerpo"></div>`;
  // Tamaño y posición: centrada, en cascada, sin tapar la barra de tareas
  const W = innerWidth, H = innerHeight - 48;
  const ancho = Math.min(a.ancho, W - 120), alto = Math.min(a.alto, H - 40);
  const corrimiento = (abiertas++ % 5) * 26;
  v.style.width = ancho + 'px';
  v.style.height = alto + 'px';
  v.style.left = Math.max(100, (W - ancho) / 2 - 50 + corrimiento) + 'px';
  v.style.top = Math.max(12, (H - alto) / 2 - 30 + corrimiento) + 'px';
  $('#ventanas').append(v);
  v.addEventListener('pointerdown', () => enfocar(v));
  $('.cerrar', v).onclick = () => cerrar(app);
  $('.min', v).onclick = (e) => { e.stopPropagation(); v.hidden = true; marcarTareas(); };
  $('.max', v).onclick = () => v.classList.toggle('max');
  const tit = $('.titulo', v);
  tit.addEventListener('dblclick', (e) => { if (!e.target.closest('button')) v.classList.toggle('max'); });
  tit.addEventListener('pointerdown', (e) => arrastrar(e, v));
  ventanas[app] = v;
  a.api = a.crear($('.cuerpo', v), v);
  return v;
}

function abrir(app, arg) {
  const v = ventana(app);
  const nueva = v.hidden || !v.dataset.vista;
  v.hidden = false;
  v.dataset.vista = '1';
  if (nueva && !quieto) { v.classList.remove('abriendo'); void v.offsetWidth; v.classList.add('abriendo'); }
  if (arg !== undefined && APPS[app].api?.cargar) APPS[app].api.cargar(arg);
  enfocar(v);
  cerrarInicio();
  return APPS[app].api;
}

function cerrar(app) {
  ventanas[app]?.remove();
  delete ventanas[app];
  delete APPS[app].api;
  marcarTareas();
}

function enfocar(v) {
  v.style.zIndex = ++zTope;
  document.querySelectorAll('.ventana').forEach((x) => x.classList.toggle('enfocada', x === v));
  marcarTareas();
  APPS[v.dataset.app].api?.foco?.();
}

function arrastrar(e, v) {
  if (e.button !== 0 || e.target.closest('button, select, input, a') || v.classList.contains('max') || telefono()) return;
  const x0 = e.clientX - v.offsetLeft, y0 = e.clientY - v.offsetTop;
  document.body.classList.add('arrastrando');
  const mover = (ev) => {
    v.style.left = Math.min(innerWidth - 80, Math.max(-v.offsetWidth + 120, ev.clientX - x0)) + 'px';
    v.style.top = Math.min(innerHeight - 90, Math.max(0, ev.clientY - y0)) + 'px';
  };
  const soltar = () => {
    document.body.classList.remove('arrastrando');
    removeEventListener('pointermove', mover);
    removeEventListener('pointerup', soltar);
  };
  addEventListener('pointermove', mover);
  addEventListener('pointerup', soltar);
}

// ── Barra de tareas, menú Inicio, íconos del escritorio ───────────────
const ORDEN = ['terminal', 'verificador', 'navegador', 'archivos', 'editor'];
function armarTareas() {

  $('#apps').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'btnInicio') return alternarInicio();
    const v = ventanas[b.dataset.app];
    if (v && !v.hidden && +v.style.zIndex === zTope) { v.hidden = true; marcarTareas(); } else abrir(b.dataset.app);
  };
}
function marcarTareas() {
  const arriba = Object.values(ventanas).filter((v) => !v.hidden).sort((a, b) => b.style.zIndex - a.style.zIndex)[0];
  document.querySelectorAll('#apps button[data-app]').forEach((b) => {
    b.classList.toggle('abierta', !!ventanas[b.dataset.app]);
    b.classList.toggle('activa', !!arriba && ventanas[b.dataset.app] === arriba);
  });
}
function alternarInicio() {
  const abierto = $('#inicio').classList.toggle('abierto');
  $('#btnInicio').setAttribute('aria-expanded', abierto);
}

  $('#inicio').classList.remove('abierto');

}

// ── Sistema de archivos (solo lectura) ────────────────────────────────
const ARCHIVOS = Object.fromEntries(D.archivos.map((a) => [a.ruta, a]));
function listar(dir) {
  const pre = dir ? dir + '/' : '';
  const carpetas = new Set(), archivos = [];
  for (const ruta of Object.keys(ARCHIVOS)) {
    if (!ruta.startsWith(pre)) continue;
    const resto = ruta.slice(pre.length);
    if (resto.includes('/')) carpetas.add(resto.split('/')[0]);
    else archivos.push(resto);
  }
  return { carpetas: [...carpetas].sort(), archivos: archivos.sort() };
}
const esCarpeta = (ruta) => ruta === '' || Object.keys(ARCHIVOS).some((r) => r.startsWith(ruta + '/'));
function normalizarRuta(ruta) {
  return ruta.replace(/\\/g, '/').replace(/^"|"$/g, '').replace(/^c:\/users\/francisco\/vigia-ernc\/?/i, '')
    .replace(/^\.\//, '').replace(/\/+$/, '');
}
const tamano = (b) => b == null ? '' : `${Math.max(1, Math.round(b / 1024)).toLocaleString('es-CL')} KB`;

function abrirArchivo(ruta) {
  const a = ARCHIVOS[ruta];
  if (!a) return;
  if (a.tipo === 'pdf') return abrir('verificador', { edicion: ruta.match(/(\d{6})\.pdf$/)[1] });
  if (a.tipo === 'web') return abrir('navegador');
  if (a.tipo === 'base') return abrir('terminal').ejecutar(`python -m vigia sql "${D.consultas[1]}"`);
  if (a.tipo === 'esta') return abrir('terminal').escribirTexto('docs\\index.html es esta misma página: el escritorio que estás usando.\n');

}

function crearTerminal(cuerpo, v) {

  const term = $('.term', cuerpo), salida = $('.salida', cuerpo), entrada = $('input', cuerpo), linea = $('.linea-entrada', cuerpo);
  const PROMPT = `PS ${esc(CASA)}&gt; `;
  $('.prompt', cuerpo).innerHTML = PROMPT;
  const historial = [];
  let posHist = 0, ocupado = false, apurar = false;

  const abajo = () => { term.scrollTop = term.scrollHeight; };
  const html = (h) => { salida.insertAdjacentHTML('beforeend', h); abajo(); };
  const ord = (o, texto = o) => `<span class="orden" data-orden="${esc(o)}" role="button" tabindex="0">${esc(texto)}</span>`;

  function colorear(l) {
    const e = esc(l);
    if (/\[error\]|ERROR|FAILED|faltante \(HTTP/.test(l)) return `<span class="t-error">${e}</span>`;
    if (/\[aviso\]/.test(l)) return `<span class="t-aviso">${e}</span>`;
    if (/\bpassed\b|campos correctos|: ok \(/.test(l)) return `<span class="t-ok">${e}</span>`;
    if (/^(Descargando|Extrayendo|Validando|Precisión|Página escrita|Controles:|Grabando|Escritorio)/.test(l)) return `<span class="t-titulo">${e}</span>`;
    if (/^-+(\s+-+)*$/.test(l)) return `<span class="t-tenue">${e}</span>`;
    return e;
  }
  function ritmo(l) {
    if (apurar || quieto) return 0;
    if (/leído vía|filas \(\d intento/.test(l)) return 240;  // cada edición: una lectura del modelo
    if (/: ok \(|faltante \(HTTP/.test(l)) return 70;        // cada descarga
    return 22;
  }
  async function reproducir(texto) {
    for (const l of texto.split('\n')) {
      html(colorear(l) + '\n');
      const ms = ritmo(l);
      if (ms) await espera(ms);
    }
  }

  function bienvenida() {
    const r = RESUMEN;
    html(`<span class="t-titulo">Vigía ERNC</span>  <span class="t-tenue">·  ${esc(D.autor.nombre)}</span>

Un agente lee los reportes mensuales ERNC de la Comisión Nacional de Energía,
extrae los proyectos de cada tabla y siete reglas verifican cada número
antes de guardarlo. <span class="t-acento">El modelo propone, las reglas verifican.</span>

  ${ord('python -m vigia todo')}         descarga, lectura, verificación y publicación
  ${ord('python -m vigia precision')}    el modelo contra 216 campos de referencia
  ${ord('pytest -q')}                    pruebas del código
  ${ord('start verificador')}            el texto del PDF junto a lo que extrajo el modelo
  ${ord('start informe')}                el resultado publicado
  ${ord('ayuda')}                        todas las órdenes

<span class="t-tenue">Última corrida: ${r.reportes} reportes · ${r.filas} filas · ${r.ok} controles ok · ${r.avisos} avisos · ${r.errores} errores</span>
<span class="t-tenue">Haz clic en una orden o escríbela.</span>

`);
  }

  function ayuda() {
    html(`<span class="t-titulo">Flujo</span>
  ${ord('python -m vigia todo')}              los cuatro pasos seguidos
  ${ord('python -m vigia descargar')}         baja los PDF de la CNE y guarda su huella SHA-256
  ${ord('python -m vigia extraer')}           lee las tablas con el modelo (o desde la caché)
  ${ord('python -m vigia validar')}           aplica las siete reglas y guarda en SQLite
  ${ord('python -m vigia publicar')}          escribe docs\\informe.html
  ${ord('python -m vigia precision')}         compara con la transcripción de referencia
  ${ord('pytest -q')}                         pruebas

<span class="t-titulo">Base de datos</span>
  ${ord(`python -m vigia sql "${D.consultas[0]}"`, 'sql totales')}        filas, MW y MMUSD por etapa
  ${ord(`python -m vigia sql "${D.consultas[1]}"`, 'sql controles')}      resultado de cada regla
  ${ord(`python -m vigia sql "${D.consultas[2]}"`, 'sql baterias')}       aprobados con almacenamiento

<span class="t-titulo">Escritorio</span>
  ${ord('ls')} [carpeta]   ${ord('cat README.md', 'cat')} archivo   ${ord('start archivos', 'start')} archivo|verificador|informe|archivos
  ${ord('whoami')}   ${ord('cls')}   ↑ ↓ historial   Tab completa
`);
  }

  // Órdenes cortas que llevan a la consulta grabada
  const ALIAS = { 'sql totales': 0, 'sql controles': 1, 'sql baterias': 2, 'sql baterías': 2 };
  const COMPLETAR = [...Object.keys(D.terminal), 'ayuda', 'start verificador', 'start informe', 'start archivos',
    'cat README.md', 'ls', 'whoami', 'cls', ...Object.keys(ALIAS)];

  async function ejecutar(orden, { tipear = true } = {}) {
    if (ocupado) return;
    ocupado = true;
    apurar = false;
    linea.hidden = true;
    entrada.value = '';
    html(PROMPT);
    if (tipear && !quieto) {
      for (const c of orden) { html(esc(c)); await espera(apurar ? 0 : 16); }
    } else html(esc(orden));
    html('\n');
    if (orden.trim()) { historial.push(orden); posHist = historial.length; }
    try { await interpretar(orden.trim().replace(/\s+/g, ' ')); }
    finally {
      if (orden.trim() && !/^(cls|clear)$/i.test(orden.trim())) html('\n');
      ocupado = false;
      linea.hidden = false;
      abajo();
      if (!telefono()) entrada.focus({ preventScroll: true });
    }
  }

  async function interpretar(o) {
    if (!o) return;
    const orden = o.replace(/^(py|python3) /, 'python ').replace(/^pytest$/, 'pytest -q');
    if (orden in ALIAS) return reproducir(D.terminal[`python -m vigia sql "${D.consultas[ALIAS[orden]]}"`]);
    if (orden in D.terminal) return reproducir(D.terminal[orden]);
    const [cmd, ...resto] = o.split(' ');
    const arg = resto.join(' ');
    switch (cmd.toLowerCase()) {
      case 'ayuda': case 'help': case 'get-help': return ayuda();
      case 'cls': case 'clear': case 'clear-host': salida.innerHTML = ''; return;
      case 'whoami':
        return html(`${esc(D.autor.nombre)} · ${esc(D.autor.cargo)}
Procesos, automatización y datos. Este proyecto: Python, SQLite y un modelo de lenguaje con verificación.
${[D.autor.correo, D.autor.linkedin, D.autor.github].filter(Boolean).map(esc).join('\n')}`);
      case 'ls': case 'dir': case 'get-childitem': {
        const dir = normalizarRuta(arg || '');
        if (!esCarpeta(dir)) return html(`<span class="t-error">Get-ChildItem : No se encuentra la ruta '${esc(CASA + '\\' + win(dir))}' porque no existe.</span>\n`);
        const { carpetas, archivos } = listar(dir);
        const pre = dir ? dir + '/' : '';
        const filas = carpetas.map((c) => `d-----  ${''.padStart(9)}  <span class="carpeta orden" data-orden="ls ${esc(win(pre + c))}">${esc(c)}</span>`)
          .concat(archivos.map((a) => `-a----  ${String(ARCHIVOS[pre + a].bytes ?? '').padStart(9)}  ${ord(`start ${win(pre + a)}`, a)}`));
        return html(`\n    Directorio: ${esc(CASA + (dir ? '\\' + win(dir) : ''))}\n\n<span class="t-tenue">Mode       Length  Name\n----       ------  ----</span>\n${filas.join('\n')}\n`);
      }
      case 'cat': case 'type': case 'gc': case 'get-content': {
        const ruta = normalizarRuta(arg);
        const a = ARCHIVOS[ruta];
        if (!a) return html(`<span class="t-error">Get-Content : No se encuentra la ruta '${esc(arg || '')}' porque no existe.</span>\n`);
        if (!a.contenido) return html(`${esc(win(ruta))} es un archivo binario; prueba ${ord('start ' + win(ruta))}\n`);
        return html(esc(a.contenido));
      }
      case 'start': case 'ii': case 'invoke-item': case 'explorer': case 'abrir': {
        const destino = normalizarRuta(arg);
        if (['verificador', 'informe', 'navegador', 'archivos', 'editor'].includes(destino)) {
          abrir({ informe: 'navegador' }[destino] || destino);
          return;
        }
        if (destino === '.' || destino === '') return void abrir('archivos', '');
        if (ARCHIVOS[destino]) return void abrirArchivo(destino);
        if (esCarpeta(destino)) return void abrir('archivos', destino);
        return html(`<span class="t-error">${esc(cmd)} : No se encuentra '${esc(arg)}'.</span> Prueba ${ord('start verificador')} o ${ord('ls')}\n`);
      }
      case 'cd': case 'set-location':
        return html(`<span class="t-tenue">Esta demo se queda en ${esc(CASA)}. Usa ${ord('ls')} para mirar las carpetas.</span>\n`);
      case 'python': case 'py':
        return html(`<span class="t-tenue">En esta demo están grabadas las órdenes de ${ord('ayuda')}.</span>\n`);
      default:
        return html(`<span class="t-error">${esc(cmd)} : El término '${esc(cmd)}' no se reconoce como nombre de un cmdlet, función o programa ejecutable.</span>\nEscribe ${ord('ayuda')} para ver las órdenes de esta demo.\n`);
    }
  }

  salida.addEventListener('click', (e) => {
    const o = e.target.closest('.orden');
    if (o) { e.stopPropagation(); ejecutar(o.dataset.orden); }
  });
  salida.addEventListener('keydown', (e) => {
    const o = e.target.closest('.orden');
    if (o && e.key === 'Enter') ejecutar(o.dataset.orden);
  });
  term.addEventListener('click', () => {
    if (ocupado) { apurar = true; return; }
    if (!getSelection().toString()) entrada.focus({ preventScroll: true });
  });
  term.addEventListener('keydown', () => { if (ocupado) apurar = true; });
  entrada.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); ejecutar(entrada.value, { tipear: false }); }
    else if (e.key === 'ArrowUp' && historial.length) { e.preventDefault(); posHist = Math.max(0, posHist - 1); entrada.value = historial[posHist]; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); posHist = Math.min(historial.length, posHist + 1); entrada.value = historial[posHist] || ''; }
    else if (e.key === 'Tab') {
      e.preventDefault();
      const val = entrada.value;
      const candidatos = [...new Set(COMPLETAR.filter((c) => c.startsWith(val) && c !== val))];
      if (candidatos.length === 1) entrada.value = candidatos[0];
      else if (candidatos.length > 1) {
        let comun = candidatos[0];
        for (const c of candidatos) while (!c.startsWith(comun)) comun = comun.slice(0, -1);
        if (comun.length > val.length) entrada.value = comun;
        else html(PROMPT + esc(val) + '\n' + candidatos.slice(0, 12).map((c) => ord(c)).join('   ') + '\n\n');
      }
    } else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); salida.innerHTML = ''; }
  });

  bienvenida();
  return {
    ejecutar: (o) => ejecutar(o),
    escribirTexto: (t) => html(esc(t)),
    foco: () => { if (!ocupado && !telefono()) entrada.focus({ preventScroll: true }); },
  };
}

// ── Explorador de archivos ────────────────────────────────────────────
function crearExplorador(cuerpo, v) {
  const FLECHA = (d) => `<svg viewBox="0 0 14 14"><path d="${d}"/></svg>`;
  cuerpo.innerHTML = `
    <div class="exp-barra">
      <button class="flecha atras" aria-label="Atrás">${FLECHA('M12 7H2M6 3L2 7l4 4')}</button>
      <button class="flecha arriba" aria-label="Subir un nivel">${FLECHA('M7 12V2M3 6l4-4 4 4')}</button>
      <div class="direccion"></div>
    </div>
    <div class="exp">
      <nav class="lado" aria-label="Acceso rápido"></nav>
      <div class="exp-main"><div class="lista"></div><div class="estado"></div></div>
    </div>`;
  const LUGARES = [['', 'vigia-ernc'], ['vigia', 'vigia'], ['datos/reportes', 'Reportes CNE'], ['datos/extracciones', 'Extracciones'], ['tests', 'Pruebas'], ['docs', 'docs']];
  let actual = '';
  const pila = [];
  function cargar(dir, { guardar = true } = {}) {
    if (guardar && dir !== actual) pila.push(actual);
    actual = dir;
    $('.lado', cuerpo).innerHTML = `<p class="grupo">Acceso rápido</p>` + LUGARES.map(([r, n]) =>
      `<button data-dir="${r}" aria-current="${r === dir}">${ICONO.carpeta}${n}</button>`).join('');
    const partes = dir ? dir.split('/') : [];
    $('.direccion', cuerpo).innerHTML = ICONO.carpeta + `<span class="sep">›</span><button data-dir="">vigia-ernc</button>` + partes.map((p, i) =>
      `<span class="sep">›</span><button data-dir="${partes.slice(0, i + 1).join('/')}">${esc(p)}</button>`).join('');
    $('.atras', cuerpo).disabled = !pila.length;
    $('.arriba', cuerpo).disabled = !dir;
    const { carpetas, archivos } = listar(dir);
    const pre = dir ? dir + '/' : '';
    $('.lista', cuerpo).innerHTML = `<table>
      <thead><tr><th>Nombre</th><th>Tipo</th><th class="n">Tamaño</th></tr></thead>
      <tbody>${carpetas.map((c) => `<tr tabindex="0" data-dir="${esc(pre + c)}"><td class="nombre">${ICONO.carpeta}${esc(c)}</td><td>Carpeta de archivos</td><td></td></tr>`).join('')}
      ${archivos.map((a) => `<tr tabindex="0" data-archivo="${esc(pre + a)}"><td class="nombre">${iconoArchivo(a)}${esc(a)}</td><td>${tipoDe(a)[2]}</td><td class="n">${tamano(ARCHIVOS[pre + a].bytes)}</td></tr>`).join('')}</tbody>
    </table>`;
    $('.estado', cuerpo).textContent = `${carpetas.length + archivos.length} elementos · doble clic para abrir`;
    $('h2', v).textContent = `${partes.at(-1) || 'vigia-ernc'} - Explorador de archivos`;
  }
  const accion = (el) => {
    if (!el) return;
    if (el.dataset.dir !== undefined) cargar(el.dataset.dir);
    else if (el.dataset.archivo) abrirArchivo(el.dataset.archivo);
  };
  $('.lado', cuerpo).onclick = (e) => accion(e.target.closest('button'));
  $('.direccion', cuerpo).onclick = (e) => accion(e.target.closest('button'));
  $('.atras', cuerpo).onclick = () => { if (pila.length) cargar(pila.pop(), { guardar: false }); };
  $('.arriba', cuerpo).onclick = () => cargar(actual.split('/').slice(0, -1).join('/'));
  const lista = $('.lista', cuerpo);
  lista.onclick = (e) => {
    const tr = e.target.closest('tbody tr');
    lista.querySelectorAll('tr.sel').forEach((x) => x.classList.remove('sel'));
    if (tr) { tr.classList.add('sel'); if (telefono()) accion(tr); }
  };
  lista.ondblclick = (e) => accion(e.target.closest('tbody tr'));
  lista.onkeydown = (e) => { if (e.key === 'Enter') accion(e.target.closest('tbody tr')); };
  cargar('', { guardar: false });
  return { cargar: (dir) => cargar(dir || '') };
}

// ── Editor (solo lectura) con resaltado ───────────────────────────────
const KW = 'def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|try|except|finally|raise|None|True|False|lambda|yield|continue|break|pass|is|assert|global';
function resaltar(texto, ext) {
  const e = String(texto).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));  // comillas intactas: el resaltado las necesita
  if (ext === 'py') {
    const re = new RegExp(`("""[\\s\\S]*?"""|'''[\\s\\S]*?'''|[rf]?"(?:\\\\.|[^"\\\\\\n])*"|[rf]?'(?:\\\\.|[^'\\\\\\n])*'|#[^\\n]*|\\b(?:${KW})\\b|\\b\\d+(?:\\.\\d+)?\\b)`, 'g');
    return e.replace(re, (m) => {
      if (m.startsWith('#')) return `<span class="hl-c">${m}</span>`;
      if (/^[rf]?["']/.test(m)) return `<span class="hl-s">${m}</span>`;
      if (/^\d/.test(m)) return `<span class="hl-n">${m}</span>`;
      return `<span class="hl-k">${m}</span>`;
    }).replace(/(<span class="hl-k">(?:def|class)<\/span> )(\w+)/g, '$1<span class="hl-f">$2</span>');
  }
  if (ext === 'json') {
    return e.replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(-?\d+(?:\.\d+)?|true|false|null)\b/g, (m, s, dosp, n) =>
      s ? (dosp ? `<span class="hl-f">${s}</span>${dosp}` : `<span class="hl-s">${s}</span>`) : `<span class="hl-n">${n}</span>`);
  }
  if (ext === 'md') {
    return e.replace(/^(#{1,6} .*)$/gm, '<span class="hl-h">$1</span>')
      .replace(/^(```[\s\S]*?```)$/gm, '<span class="hl-c">$1</span>')
      .replace(/(`[^`\n]+`)/g, '<span class="hl-s">$1</span>');
  }
  return e;
}
function crearEditor(cuerpo, v) {
  cuerpo.innerHTML = `<div class="editor"><pre class="nums" aria-hidden="true"></pre><pre class="codigo"></pre></div><div class="editor-estado"></div>`;
  function cargar(ruta) {
    const a = ARCHIVOS[ruta];
    if (!a || a.contenido == null) return;
    const texto = a.contenido.replace(/\n$/, '');
    const ext = ruta.split('.').pop();
    const lineas = texto.split('\n').length;
    $('.codigo', cuerpo).innerHTML = resaltar(texto, ext);
    $('.nums', cuerpo).textContent = Array.from({ length: lineas }, (_, i) => i + 1).join('\n');
    const carpeta = ruta.split('/').slice(0, -1).join('/');
    $('h2', v).textContent = `${ruta.split('/').pop()} - ${CASA}${carpeta ? '\\' + win(carpeta) : ''}`;
    $('.editor-estado', cuerpo).innerHTML = `<span>${lineas} líneas</span><span>${tipoDe(ruta)[2]}</span><span>UTF-8</span><span>Solo lectura</span>`;
    $('.editor', cuerpo).scrollTo(0, 0);
  }
  cargar('README.md');
  return { cargar };
}

// ── Verificador: la página del PDF junto a la extracción y las reglas ─
const NOMBRE_REGLA = { totales: 'Totales', conteo: 'Conteo', evidencia: 'Evidencia', fecha_en_mes: 'Fecha', rango: 'Rango', faltante: 'Faltante', duplicado: 'Duplicado' };
const PEOR = (cs) => cs.some((c) => c.resultado === 'error') ? 'error' : cs.some((c) => c.resultado === 'aviso') ? 'aviso' : 'ok';
const GENERICAS = /^(parque|planta|central|proyecto|solar|fotovoltaic[ao]s?|e[oó]lic[ao]|energ[ií]a|chile|spa\.?|s\.a\.|almacenamiento|generaci[oó]n|sistema|modificaci[oó]n|ampliaci[oó]n|l[ií]nea|transmisi[oó]n|mediante|baterías|hidroel[eé]ctrica)$/i;
function crearVerificador(cuerpo, v) {
  const conDatos = EDS.filter((e) => e.estado === 'ok');
  let ed = conDatos.at(-1)?.edicion, etapa = 'aprobacion';
  cuerpo.innerHTML = `
    <div class="ver">
      <nav class="lado" aria-label="Ediciones"></nav>
      <div class="ver-main">
        <div class="ver-barra">
          <div class="segmentado" role="group" aria-label="Tabla">
            <button data-etapa="ingreso">Ingresos</button><button data-etapa="aprobacion">Aprobados</button>
          </div>
          <span class="info"></span>
        </div>
        <div class="ver-paneles">
          <section class="ver-fuente"><h3>Texto de la página, tal como lo recibe el modelo</h3><pre></pre></section>
          <section class="ver-extr"></section>
        </div>
      </div>
    </div>`;

  function lado() {
    $('.lado', cuerpo).innerHTML = EDS.map((e) => {
      if (e.estado !== 'ok') return `<button data-ed="${e.edicion}" class="faltante" aria-current="${e.edicion === ed}"><span>${edCorta(e.edicion)}</span><span class="marca m-nada" title="no publicado"></span></button>`;
      const p = PEOR(e.controles);
      return `<button data-ed="${e.edicion}" aria-current="${e.edicion === ed}"><span>${edCorta(e.edicion)}</span><span class="marca m-${p}" title="${p}"></span></button>`;
    }).join('');
  }

  function tokens(f) {
    // Lo que debería estar escrito en la página para esta fila: números, fecha y palabras propias del nombre
    const t = [];
    for (const val of [f.potencia_mw, f.inversion_musd]) if (val != null) t.push(`(?<![\\d.,])${comoTexto(val).replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1\\.?')}(?![\\d,])`);
    const [a, m, d] = f.fecha.split('-');
    t.push(`${d}\\s*[-/]\\s*${m}\\s*[-/]\\s*${a}`);
    const palabras = (f.nombre + ' ' + f.titular).split(/\s+/)
      .filter((p) => p.replace(/[^\p{L}\d]/gu, '').length >= 5 && !GENERICAS.test(p));
    for (const p of palabras.slice(0, 6)) t.push(p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    return t;
  }

  function fuente(fila) {
    const pag = EDS.find((e) => e.edicion === ed).paginas[etapa];
    const pre = $('.ver-fuente pre', cuerpo);
    if (!fila) { pre.textContent = pag.texto; return; }
    const re = new RegExp(tokens(fila).join('|'), 'gi');
    pre.innerHTML = esc(pag.texto).replace(re, (m) => `<mark>${m}</mark>`);
    const [a, , d] = fila.fecha.split('-');
    const marcas = [...pre.querySelectorAll('mark')];
    const primera = marcas.find((x) => x.textContent.startsWith(d) && x.textContent.includes(a)) || marcas[0];
    if (primera) pre.scrollTo({ top: primera.offsetTop - pre.clientHeight / 3, behavior: quieto ? 'auto' : 'smooth' });
  }

  function mostrar() {
    lado();
    const e = EDS.find((x) => x.edicion === ed);
    cuerpo.querySelectorAll('.segmentado button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.etapa === etapa));
    $('h2', v).textContent = `Verificador - ${e.estado === 'ok' ? 'edición de ' + edLarga(e.edicion) : 'edición faltante'}`;
    $('.ver-main', cuerpo).querySelector('.ausente')?.remove();
    if (e.estado !== 'ok') {
      $('.ver-paneles', cuerpo).hidden = true;
      $('.info', cuerpo).innerHTML = '';
      $('.ver-main', cuerpo).insertAdjacentHTML('beforeend', `<p class="ausente">La CNE no publicó la edición de ${edLarga(e.edicion)} en la dirección esperada (HTTP 404).<br>Se registró como faltante y el resto siguió.</p>`);
      return;
    }
    $('.ver-paneles', cuerpo).hidden = false;
    const pag = e.paginas[etapa];
    $('.info', cuerpo).innerHTML = `Página ${pag.pagina} del <a href="${esc(e.url)}" target="_blank" rel="noopener">PDF de la CNE</a> · ${e.intentos} intento${e.intentos === 1 ? '' : 's'} del modelo`;
    fuente(null);

    const filas = e.filas.filter((f) => f.etapa === etapa);
    const ctrl = e.controles.filter((c) => c.etapa === etapa);
    const dec = e.declarado[etapa];
    $('.ver-extr', cuerpo).innerHTML = `
      <h3>Filas que devolvió el modelo · pasa el cursor o toca una fila para ver de dónde sale</h3>
      <table>
        <thead><tr><th>Proyecto</th><th>Titular</th><th>Reg.</th><th>Fecha</th><th class="n">MW</th><th class="n">MMUSD</th><th>Bat.</th></tr></thead>
        <tbody>${filas.map((f, i) => `<tr data-i="${i}" tabindex="0"><td>${esc(f.nombre)}<br><span class="sub">${esc(f.tecnologia)}</span></td><td>${esc(f.titular)}</td><td>${esc(f.region)}</td><td style="white-space:nowrap">${esc(f.fecha)}</td><td class="n${f.potencia_mw == null ? ' vacio' : ''}">${f.potencia_mw == null ? 'vacío' : num(f.potencia_mw)}</td><td class="n${f.inversion_musd == null ? ' vacio' : ''}">${f.inversion_musd == null ? 'vacío' : num(f.inversion_musd)}</td><td>${f.almacenamiento ? 'Sí' : 'No'}</td></tr>`).join('')}</tbody>
      </table>
      ${dec ? `<h3>Lo que declara el texto del reporte</h3>
      <p class="declarado"><b>${dec.proyectos} proyectos · ${num(dec.mw)} MW · ${num(dec.mmusd)} MMUSD</b><br>«${esc(dec.cita)}»</p>` : ''}
      <h3>Siete reglas</h3>
      <ul class="reglas">${ctrl.map((c) => `<li class="${c.resultado}"><span class="marca m-${c.resultado}" title="${c.resultado}"></span><b>${NOMBRE_REGLA[c.regla] || c.regla}</b><span class="det">${esc(c.detalle)}</span></li>`).join('')}</ul>
      ${e.via ? `<p class="nota-ver">Extracción: ${esc(D.modelo)}, ${esc(e.via)}.</p>` : ''}`;
    const filasDom = cuerpo.querySelectorAll('.ver-extr tbody tr');
    filasDom.forEach((tr) => {
      const elegir = () => { filasDom.forEach((x) => x.classList.toggle('activa', x === tr)); fuente(filas[tr.dataset.i]); };
      tr.addEventListener('mouseenter', elegir);
      tr.addEventListener('focus', elegir);
      tr.addEventListener('click', elegir);
    });
  }

  $('.lado', cuerpo).onclick = (e) => { const b = e.target.closest('button'); if (b) { ed = b.dataset.ed; mostrar(); } };
  $('.segmentado', cuerpo).onclick = (e) => { const b = e.target.closest('button'); if (b) { etapa = b.dataset.etapa; mostrar(); } };
  mostrar();
  return { cargar: (o) => { if (o?.edicion) ed = o.edicion; if (o?.etapa) etapa = o.etapa; mostrar(); } };
}
